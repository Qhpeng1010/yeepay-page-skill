<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Ledger - 商户入驻配置步骤页</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --primary-active: #D94B35;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --divider: #F0F0F0;
      --text: rgba(0, 0, 0, .85);
      --text-secondary: rgba(0, 0, 0, .65);
      --text-tertiary: rgba(0, 0, 0, .45);
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1120px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 128px;
      height: 40px;
      display: block;
      object-fit: contain;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      font-weight: 400;
      width: 207px !important;
    }

    .sider.collapsed .ant-menu-inline-collapsed {
      width: 48px !important;
    }

    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item,
    .sider.collapsed .sider-menu .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      padding-left: 16px !important;
      text-align: left;
    }

    .sider.collapsed .sider-menu .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-item .anticon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .anticon {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-inline-end: 0 !important;
      min-width: 0 !important;
      font-size: 16px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title .anticon {
      color: var(--primary) !important;
    }

    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: var(--selected-bg) !important;
    }

    .sider-menu .ant-menu-item-selected::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--primary);
    }

    .collapse-control {
      height: 48px;
      border-top: 1px solid #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 16px;
      color: var(--text-tertiary);
      cursor: pointer;
    }

    .sider.collapsed .collapse-control {
      justify-content: flex-start;
      padding-left: 16px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .work-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .tab-strip {
      height: 48px;
      flex: 0 0 auto;
      padding-top: 4px;
      padding-left: 16px;
      background: var(--page-bg);
      box-sizing: border-box;
    }

    .boss-tabs.ant-tabs {
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav {
      margin: 0 !important;
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav::before {
      border-bottom: 0 !important;
    }

    .boss-tabs .ant-tabs-tab {
      height: 44px;
      margin: 0 !important;
      padding: 0 12px !important;
      background: #eee !important;
      border: 0 !important;
      border-radius: 4px 4px 0 0 !important;
      color: var(--text-secondary);
    }

    .boss-tabs .ant-tabs-tab-active {
      background: #fff !important;
      border-radius: 8px 8px 0 0 !important;
    }

    .boss-tabs .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 0;
      max-width: 144px;
    }

    .tab-label .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-label .anticon {
      color: #B8B8B8;
      font-size: 14px;
      flex: 0 0 auto;
      margin-inline-end: 6px;
    }

    .boss-tabs .ant-tabs-tab-remove {
      color: #B8B8B8 !important;
      margin-left: 4px !important;
    }

    .boss-tabs .ant-tabs-ink-bar {
      display: none;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px 16px;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
    }

    .wizard-panel {
      background: #fff;
      border-radius: 0 8px 8px 8px;
      min-height: calc(100vh - 204px);
      padding: 48px 80px 96px;
      position: relative;
    }

    .wizard-steps {
      max-width: 1040px;
      margin: 0 auto 44px;
    }

    .wizard-content {
      max-width: 1040px;
      min-height: 342px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 700px) 340px;
      column-gap: 0;
      align-items: start;
    }

    .wizard-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 342px));
      gap: 24px 16px;
      align-items: start;
    }

    .wizard-form-grid .ant-form-item {
      margin-bottom: 0;
      min-width: 0;
    }

    .ant-form-item-label > label {
      column-gap: 8px;
    }

    .ant-form-horizontal .ant-form-item-label,
    .ant-form-vertical .ant-form-item-label {
      padding-bottom: 8px;
      padding-inline-end: 0;
    }

    .ant-form-item-label > label::after {
      margin-inline-start: 0 !important;
      margin-inline-end: 0 !important;
    }

    .wizard-form-grid .ant-input,
    .wizard-form-grid .ant-select {
      width: 100%;
    }

    .wizard-aside {
      height: 335px;
      padding: 24px 0 0 32px;
      box-sizing: border-box;
    }

    .aside-visual {
      min-height: 264px;
      background: linear-gradient(180deg, #FAFAFA 0%, #FFFFFF 100%);
      border-radius: 8px;
      padding: 20px;
      color: var(--text-secondary);
    }

    .aside-title {
      color: var(--text);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .aside-row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      color: var(--text-secondary);
    }

    .aside-row .anticon {
      color: var(--primary);
    }

    .summary-block {
      grid-column: 1 / -1;
    }

    .summary-block .ant-descriptions {
      background: #fff;
    }

    .summary-title {
      margin: 0 0 16px;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--processing);
    }

    .footer-actions {
      position: fixed;
      inset: auto auto 0 208px;
      width: calc(100vw - 208px);
      bottom: 0;
      height: 48px;
      padding: 8px 24px;
      box-sizing: border-box;
      background: #fff;
      border-top: 1px solid var(--divider);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      z-index: 8;
      transition: left .2s ease;
    }

    .footer-actions.query-actions {
      grid-column: auto;
      justify-self: stretch;
      width: calc(100vw - 208px);
      text-align: right;
    }

    .sider-collapsed .footer-actions {
      left: 48px;
      width: calc(100vw - 48px);
    }

    .sider-collapsed .footer-actions.query-actions {
      width: calc(100vw - 48px);
    }

    .query-actions {
      grid-column: 3 / 4;
      justify-self: end;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      column-gap: 8px;
      min-width: 0;
      text-align: right;
    }

    .empty-state {
      min-height: 430px;
      background: #fff;
      border-radius: 0 8px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      margin-top: 12px;
      height: 32px;
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 12px;
      box-sizing: border-box;
    }

    .ant-btn-primary {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      box-shadow: none !important;
      font-weight: 400;
    }

    .ant-btn-primary:hover,
    .ant-btn-primary:focus {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
    }

    .ant-btn-primary:active {
      background: var(--primary-active) !important;
      border-color: var(--primary-active) !important;
    }

    .ant-modal .ant-modal-content {
      padding: 0;
    }

    .ant-modal .ant-modal-header {
      border-bottom: 1px solid var(--divider);
      margin-bottom: 0;
      padding: 16px 24px;
    }

    .ant-modal .ant-modal-body {
      padding: 24px 24px 0;
    }

    .ant-modal .ant-modal-footer {
      border-top: 1px solid var(--divider);
      margin-top: 24px;
      padding: 10px 24px;
    }

    .ant-modal-confirm .ant-modal-body,
    .ant-modal.ant-modal-confirm .ant-modal-body {
      padding: 24px !important;
    }

    @media (max-width: 1180px) {
      .wizard-panel {
        padding-left: 32px;
        padding-right: 32px;
      }

      .wizard-content {
        grid-template-columns: minmax(0, 1fr);
      }

      .wizard-aside {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sider,
      .footer-actions {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"><img class="logo" src="../../specs/boss logo.svg" alt="Boss Ledger logo" data-boss-logo-source="specs/boss logo.svg" style="display:none" /></div>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>
  <script src="./preview-app.js"></script>
</body>
</html>
