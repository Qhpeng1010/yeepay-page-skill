      const record = drawer.record || {};

        open: drawer.open,
        width: 640,

        onClose: close,
        title: React.createElement('div', { className: 'drawer-title' },

          React.createElement(Descriptions, { title: '操作记录', bordered: true, column: 1, size: 'middle' },
            React.createElement(Descriptions.Item, { label: '最近操作' }, '运营人员于 2026-07-09 10:30 查看并确认资料'),

          )

    function BossLedgerApp() {
      const [primary, setPrimary] = useState('overview');
      const [collapsed, setCollapsed] = useState(false);
      const [activePage, setActivePage] = useState('dashboard');
      const [tabs, setTabs] = useState(['dashboard']);
      const [drawer, setDrawer] = useState({ open: false, title: '', record: null });
      const openPage = (pageKey) => {
        const meta = pageMeta[pageKey];
        if (!meta) return;
        setPrimary(meta.primary);
        setActivePage(pageKey);
        setTabs(prev => prev.includes(pageKey) ? prev : prev.concat(pageKey));
      };
      const removeTab = (targetKey, e) => {
        e && e.stopPropagation();
        if (tabs.length === 1) return;
        const nextTabs = tabs.filter(k => k !== targetKey);
        setTabs(nextTabs);
        if (activePage === targetKey) {
          const next = nextTabs[nextTabs.length - 1];
          setActivePage(next);
          setPrimary(pageMeta[next].primary);
        }
      };
      const tabItems = tabs.map(key => ({
        key,
        label: React.createElement('span', { className: 'tab-title', title: pageMeta[key].label },
          key === activePage ? React.createElement(Icons.SyncOutlined, { className: 'tab-refresh' }) : null,
          React.createElement('span', null, pageMeta[key].label),
          React.createElement(Icons.CloseOutlined, { className: 'tab-close', onClick: e => removeTab(key, e) })
        )
      }));
      const openDrawer = (title, record) => setDrawer({ open: true, title, record });
      let content = React.createElement(DashboardPage);
      if (activePage === 'orders') content = React.createElement(OrdersPage, { openDrawer });
      if (activePage === 'verification') content = React.createElement(VerificationPage, { openDrawer });
      if (activePage === 'stores') content = React.createElement(StoresPage, { openDrawer });
      return React.createElement('div', { className: 'app-shell' },
        React.createElement('div', { className: 'top-info' },
          React.createElement('span', null, '商户身份：海鹏文旅集团｜上次登录：2026-07-09 09:18:32｜登录 IP：10.18.6.24'),
          React.createElement('span', null, '消息中心｜帮助文档｜退出')
        ),
        React.createElement('div', { className: 'primary-nav' },
          React.createElement('div', { className: 'brand' },
            React.createElement('img', { className: 'brand-logo', src: './assets/boss-ledger-logo.svg', alt: 'Boss Ledger' })
          ),
          React.createElement('div', { className: 'primary-menu' },
            primaryItems.map(item => React.createElement('div', {
              key: item.key,
              className: 'primary-item' + (primary === item.key ? ' active' : ''),
              onClick: () => {
                setPrimary(item.key);
                const first = item.key === 'overview' ? 'dashboard' : item.key === 'trade' ? 'orders' : 'stores';
                openPage(first);
              }
            }, item.label))
          )
        ),
        React.createElement('div', { className: 'main-area' },
          React.createElement('aside', { className: 'sider' + (collapsed ? ' collapsed' : '') },
            React.createElement('div', { className: 'menu-wrap' },
              React.createElement(Menu, {
                mode: 'inline',
                inlineCollapsed: collapsed,
                selectedKeys: [activePage],
                defaultOpenKeys: [primary + '-group'],
                openKeys: collapsed ? [] : [primary + '-group'],
                items: sideMenus[primary],
                onClick: ({ key }) => openPage(key)
              })
            ),
            React.createElement('div', { className: 'collapse-control', onClick: () => setCollapsed(!collapsed) },
              collapsed ? React.createElement(Icons.MenuUnfoldOutlined) : React.createElement(Icons.MenuFoldOutlined)
            )
          ),
          React.createElement('main', { className: 'workbench' },
            React.createElement('div', { className: 'tabs-strip' },
              React.createElement(Tabs, { className: 'bl-tabs', type: 'card', activeKey: activePage, items: tabItems, onChange: key => { setActivePage(key); setPrimary(pageMeta[key].primary); } })
            ),
            React.createElement('div', { className: 'content-scroll' },
              React.createElement('div', { className: 'content-stack' },
                React.createElement('div', { className: 'page-content' }, content),
                React.createElement('div', { className: 'footer' }, '© 2026 易宝支付有限公司 版权所有')
              )
            )
          )
        ),
        React.createElement(DetailDrawer, { drawer, setDrawer })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ConfigProvider, {
        locale: (window.antd.locales && window.antd.locales.zh_CN) || undefined,
        theme: {
          cssVar: true,
          token: {
            colorPrimary: '#F36046',
            borderRadius: 4,
            lineWidth: 1

          components: {
            Button: { borderRadius: 4 },
            Input: { borderRadius: 4 },
            Select: { borderRadius: 4 },
            Card: { borderRadiusLG: 8 }
          }
        }
      },
        React.createElement(AntApp, null, React.createElement(BossLedgerApp))
      )
    );
  </script>
