<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Ledger - 智能音箱电商运营后台</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --divider: #F0F0F0;
      --text: #1F2329;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --error: #FF4D4F;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1180px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 128px;
      height: 40px;
      display: block;
      object-fit: contain;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 32px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
      cursor: pointer;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      width: 207px !important;
      font-weight: 400;
    }

    .sider.collapsed .ant-menu-inline-collapsed {
      width: 48px !important;
    }

    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: transparent !important;
    }

    .sider-menu .ant-menu-sub .ant-menu-item-selected {
      background: var(--selected-bg) !important;
      position: relative;
    }

    .sider-menu .ant-menu-sub .ant-menu-item-selected::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 2px;
      height: 40px;
      background: var(--primary);
    }

    .sider.collapsed .ant-menu-item,
    .sider.collapsed .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }

    .sider.collapsed .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .ant-menu-item .anticon,
    .sider.collapsed .ant-menu-submenu-title .anticon {
      margin-inline-end: 0 !important;
      font-size: 16px;
    }

    .sider-toggle {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-top: 1px solid #EBEBEB;
      color: var(--text-secondary);
      cursor: pointer;
      padding-left: 16px;
      box-sizing: border-box;
    }

    .sider.collapsed .sider-toggle {
      width: 48px;
      padding-left: 16px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .tabs-area {
      height: 48px;
      padding: 4px 16px 0;
      display: flex;
      align-items: flex-end;
      flex: 0 0 48px;
      background: var(--page-bg);
      overflow: hidden;
    }

    .tabs-area .ant-tabs {
      width: 100%;
    }

    .tabs-area .ant-tabs-nav {
      margin: 0 !important;
    }

    .tabs-area .ant-tabs-tab {
      height: 44px;
      padding: 0 12px !important;
      background: #F7F7F7 !important;
      border: 0 !important;
      border-radius: 0 !important;
      color: var(--text-secondary);
    }

    .tabs-area .ant-tabs-tab-active {
      background: #fff !important;
      border-top-left-radius: 8px !important;
      border-top-right-radius: 8px !important;
    }

    .tabs-area .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .tabs-area .ant-tabs-tab:not(.ant-tabs-tab-active) [data-boss-tab-static-icon] {
      display: none;
    }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 148px;
    }

    .tab-label [data-boss-tab-static-icon] {
      color: rgba(0, 0, 0, .45) !important;
    }

    .tab-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .content-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px;
      background: var(--page-bg);
    }

    .empty-page {
      display: flex;
      min-height: calc(100vh - 92px - 48px);
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .dashboard,
    .orders-page,
    .products-page {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: calc(100vh - 92px - 48px);
    }

    .filter-bar,
    .summary-card,
    .distribution-card,
    .trend-card,
    .rank-card,
    .todo-card,
    .query-panel,
    .table-module {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .filter-bar {
      min-height: 56px;
      padding: 12px 16px;
      border-top-left-radius: 0;
      box-sizing: border-box;
    }

    .query-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: center;
      width: 100%;
    }

    .query-actions {
      grid-column: 3 / 4;
      justify-self: end;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .filter-left,
    .filter-right {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .filter-right {
      justify-content: flex-end;
      gap: 16px;
    }

    .quick-ranges {
      display: flex;
      gap: 12px;
      white-space: nowrap;
      color: var(--text-secondary);
    }

    .quick-ranges span {
      cursor: pointer;
    }

    .quick-ranges .active {
      color: var(--primary);
    }

    .filter-bar .ant-select {
      width: 150px;
    }

    .filter-bar .channel-select {
      width: 170px;
    }

    .filter-bar .ant-picker {
      width: 218px;
    }

    .top-row {
      display: grid;
      grid-template-columns: minmax(0, 850fr) minmax(300px, 335fr);
      gap: 16px;
      min-height: 359px;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      min-height: 394px;
    }

    .summary-card,
    .distribution-card,
    .trend-card,
    .rank-card,
    .todo-card,
    .query-panel,
    .table-module {
      padding: 16px;
      box-sizing: border-box;
      min-width: 0;
    }

    .module-title-row,
    .toolbar {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .module-title,
    .toolbar-title {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: rgba(0, 0, 0, .85);
    }

    .module-tabs {
      display: flex;
      gap: 16px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .module-tabs .active {
      color: var(--primary);
    }

    .summary-content {
      height: 281px;
      padding: 18px 20px;
      background: linear-gradient(135deg, #FFF5F3 0%, #FFFFFF 38%, #FFFFFF 100%);
      border-radius: 8px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }

    .primary-metric {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 96px;
    }

    .metric-label {
      color: rgba(0, 0, 0, .45);
      font-size: 13px;
      line-height: 20px;
    }

    .metric-value {
      margin-top: 8px;
      font-size: 32px;
      line-height: 40px;
      color: rgba(0, 0, 0, .85);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      white-space: nowrap;
    }

    .trend-line {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trend-up {
      color: var(--success);
    }

    .trend-down {
      color: var(--error);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 12px;
      align-content: center;
    }

    .stat-tile {
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-value {
      margin-top: 6px;
      color: rgba(0, 0, 0, .85);
      font-size: 20px;
      line-height: 28px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stat-extra,
    .chart-note,
    .rank-meta {
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }

    .todo-list {
      display: grid;
      gap: 12px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 0 12px;
      border-radius: 6px;
      background: #FAFAFA;
    }

    .todo-name {
      color: var(--text-secondary);
    }

    .todo-count {
      color: var(--primary);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .chart-box {
      width: 100%;
      height: 277px;
    }

    .small-chart {
      height: 306px;
    }

    .rank-chart {
      height: 318px;
    }

    .query-panel .ant-form {
      width: 100%;
    }

    .query-panel .ant-form-item {
      margin: 0 !important;
      width: 100%;
    }

    .query-panel .ant-form-item-control {
      flex: 1;
      min-width: 0;
    }

    .query-panel .ant-picker,
    .query-panel .ant-select,
    .query-panel .ant-input {
      width: 100%;
    }

    .table-module {
      padding: 0;
    }

    .query-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      padding: 16px 16px 0;
    }

    .inline-metrics {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-size: 14px;
      white-space: nowrap;
    }

    .inline-metrics strong {
      color: var(--primary);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .query-summary-card {
      background: #F6F6F6;
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
      box-sizing: border-box;
    }

    .table-toolbar {
      min-height: 64px;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-body {
      padding: 0 16px;
    }

    .table-pagination {
      padding: 16px 0;
      display: flex;
      justify-content: flex-end;
    }

    .operation-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .operation-buttons .ant-btn-link {
      padding: 0 !important;
      height: auto;
      color: var(--primary) !important;
      font-weight: 400 !important;
    }

    .operation-buttons .ant-btn-link:not(:disabled):hover {
      color: var(--primary-hover) !important;
      background: transparent !important;
    }

    .column-setting-button {
      width: 32px;
      height: 32px;
      padding: 0;
      background: #FAFAFA !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .column-setting-button:hover,
    .column-setting-button:focus {
      border: 0 !important;
      box-shadow: none !important;
    }

    .column-setting-panel {
      width: 180px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
    }

    .column-setting-title {
      margin-bottom: 8px;
      font-weight: 500;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }

    .status-dot.success::before {
      background: var(--success);
    }

    .status-dot.warning::before {
      background: var(--warning);
    }

    .status-dot.error::before {
      background: var(--error);
    }

    .status-dot.processing::before {
      background: var(--processing);
    }

    .drawer-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .drawer-section {
      margin-bottom: 20px;
    }

    .drawer-section-title {
      margin-bottom: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, .85);
    }

    .footer {
      height: 24px;
      flex: 0 0 24px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 20px;
      padding-top: 0;
    }

    .ant-btn-primary {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      box-shadow: none !important;
      font-weight: 400;
    }

    .ant-modal .ant-modal-content {
      padding: 0;
    }

    .ant-modal .ant-modal-header {
      border-bottom: 1px solid #F0F0F0;
      padding: 20px 24px 16px;
      margin-bottom: 0;
    }

    .ant-modal .ant-modal-body {
      padding: 24px 24px 0;
    }

    .ant-modal .ant-modal-footer {
      border-top: 1px solid #F0F0F0;
      padding: 16px 24px;
      margin-top: 0;
    }

    .ant-select-selector,
    .ant-picker {
      border-radius: 4px !important;
    }

    .ant-form-item-label {
      padding-right: 0 !important;
    }

    .ant-form-item-label > label::after {
      margin-inline-start: 0 !important;
      margin-inline-end: 8px !important;
    }

    .modal-form .ant-form-item-label {
      max-width: none !important;
    }

    .modal-form .ant-form-item-control {
      flex: 1 1 0 !important;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>
  <script src="./vendor/g2plot.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script type="text/babel">
const App = antd.App;
const Button = antd.Button;
const Checkbox = antd.Checkbox;

dayjs.locale('zh-cn');

const RangePicker = DatePicker.RangePicker;

const sections = [
  { key: 'overview', label: '音箱经营数据总览' },

  { key: 'products', label: '店铺渠道与音箱商品管理' },

const menuBySection = {
  overview: [
    {
      key: 'travel-overview',

        { key: 'distribution-store', label: '授权分销店管理' },

};

function PlatformChart(props) {
  const type = props.type;
  const config = props.config;
  const className = props.className || 'chart-box';
  const ref = React.useRef(null);
  const chartRef = React.useRef(null);

  React.useEffect(() => {
    const charts = window.G2Plot || {};
    const ChartCtor = charts[type];
    if (!ChartCtor || !ref.current) return undefined;
    if (chartRef.current && chartRef.current.destroy) chartRef.current.destroy();

    const baseConfig = Object.assign({
      autoFit: true,
      animation: false,
      appendPadding: 8,
      color: ['#F36046', '#1677FF', '#52C41A', '#FAAD14', '#722ED1', '#13C2C2'],
      legend: { position: 'top' },
    }, config);

    chartRef.current = new ChartCtor(ref.current, baseConfig);
    chartRef.current.render();

    return () => {
      if (chartRef.current && chartRef.current.destroy) chartRef.current.destroy();
    };
  }, [type, JSON.stringify(config)]);

  return <div className={className} ref={ref} />;
}

function StatusDot(props) {
  const status = props.status;
  const text = props.text;
  const cls = status === 'pending' ? 'warning' : status === 'issued' ? 'success' : status === 'cancelled' ? 'error' : status === 'changed' ? 'processing' : status;
  return <span className={`status-dot ${cls}`}>{text}</span>;
}

  const initialPage = window.location.hash === '#orders' ? 'orders' : window.location.hash === '#products' ? 'products' : 'overview';
  const activePageState = React.useState(initialPage);
  const activePage = activePageState[0];
  const setActivePage = activePageState[1];
  const defaultTabByPage = {
    overview: 'flight-dashboard',
    orders: 'all-orders',
    products: 'store-goods-list',
  };
  const activeTabState = React.useState(defaultTabByPage[initialPage]);
  const activeTab = activeTabState[0];
  const setActiveTab = activeTabState[1];
  const collapsedState = React.useState(false);
  const collapsed = collapsedState[0];
  const setCollapsed = collapsedState[1];
  const openKeysState = React.useState(['travel-overview', 'risk-todo']);
  const openKeys = openKeysState[0];
  const setOpenKeys = openKeysState[1];

  const activeMenuKey = activePage === 'overview' ? 'flight-dashboard' : activePage === 'orders' ? 'all-orders' : 'store-goods-list';
  const currentMenuItems = menuBySection[activePage] || menuBySection.overview;

  const handleSectionChange = (key) => {
    if (key === 'overview' || key === 'orders' || key === 'products') {
      setActivePage(key);
      setActiveTab(defaultTabByPage[key]);
      setOpenKeys(key === 'overview' ? ['travel-overview', 'risk-todo'] : key === 'orders' ? ['ticket-order', 'trip-doc'] : ['store-goods', 'channel-store']);
    }
  };

  const activeTabTitle = (tabsByPage[activePage] || []).find((item) => item.key === activeTab)?.title || '当前页面';
  const renderContent = () => {
    if (activePage === 'overview' && activeTab === 'flight-dashboard') return <DashboardContent />;
    if (activePage === 'orders' && activeTab === 'all-orders') return <OrderTablePage />;
    if (activePage === 'products' && activeTab === 'store-goods-list') return <ProductTablePage />;
    return <EmptyTabPage title={activeTabTitle} />;
  };

  return (
    <ConfigProvider
      locale={antd.locales && antd.locales.zh_CN}
      theme={{ cssVar: true, token: { colorPrimary: '#F36046', borderRadius: 4, lineWidth: 1 } }}
    >
      <App>
        <div className="boss-page">
          <div className="topbar" data-boss-shell="topbar">
            <div>上次登录时间：2026-07-10 09:18:32　登录 IP：10.24.18.66</div>
            <div>10080090899 · Boss Ledger 音箱运营后台　帮助中心　消息　退出</div>
          </div>
          <header className="primary-nav" data-boss-shell="primary-nav">
            <div className="logo-zone">
              <img className="logo" src="../../specs/boss logo.svg" alt="老板管账 Boss Ledger" data-boss-logo-source="specs/boss logo.svg" />
            </div>
            <nav className="primary-items" aria-label="一级导航">
              {sections.map((item) => (
                <div className={`primary-item ${activePage === item.key ? 'active' : ''}`} key={item.key} onClick={() => handleSectionChange(item.key)}>
                  {item.label}
                </div>
              ))}
            </nav>
          </header>
          <div className="shell">
            <aside className={`sider ${collapsed ? 'collapsed' : ''}`} data-boss-shell="sider">
              <div className="sider-menu">
                <Menu
                  mode="inline"
                  inlineCollapsed={collapsed}
                  inlineCollapsedWidth={48}
                  selectedKeys={[activeMenuKey]}
                  openKeys={collapsed ? [] : openKeys}
                  onOpenChange={setOpenKeys}
                  items={currentMenuItems}
                />
              </div>
              <div className="sider-toggle" data-boss-sider-collapse onClick={() => setCollapsed(!collapsed)}>
                {collapsed ? <MenuUnfoldOutlined /> : <MenuFoldOutlined />}
              </div>
            </aside>
            <section className="workspace">
              <ShellTabs activePage={activePage} activeTab={activeTab} setActiveTab={setActiveTab} />
              {renderContent()}
            </section>
          </div>
        </div>
      </App>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BossLedgerPage />);

  </script>
</body>
</html>
