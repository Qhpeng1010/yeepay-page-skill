      --error: #FF4D4F;

    html,

      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 128px;
      height: 40px;
      display: block;
      object-fit: contain;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 32px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
      cursor: pointer;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      width: 207px !important;
      font-weight: 400;
    }

    .sider.collapsed .ant-menu-inline-collapsed {
      width: 48px !important;
    }

    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: transparent !important;
    }

    .sider-menu .ant-menu-sub .ant-menu-item-selected {
      background: var(--selected-bg) !important;

    }

    .sider-menu .ant-menu-sub .ant-menu-item-selected::after {

      height: 40px;

    .tabs-area .ant-tabs-tab-active {

    .tabs-area .ant-tabs-tab-active .ant-tabs-tab-btn {

    .tab-label {

    .tab-title {

    .content-scroll {

      overflow: auto;
      padding: 0 16px;
      background: var(--page-bg);
    }

    .query-panel {
      background: #fff;
      border-radius: 0 8px 8px 8px;
      padding: 16px;
    }

    .query-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .query-grid .ant-form-item {
      margin-bottom: 0;
    }

    .query-actions {
      grid-column: 3;
      justify-self: end;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      width: 100%;
    }

    .query-actions.collapsed {
      grid-row: 2;
    }

    .query-actions.expanded {
      grid-row: 3;
    }

    .query-toggle,
    .query-toggle:hover,
    .query-toggle:focus,
    .query-toggle:active {
      padding: 0 !important;
      color: var(--text-secondary) !important;
      border: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      font-weight: 400;
    }

    .table-panel {
      margin-top: 16px;
      background: #fff;
      border-radius: 8px;
      padding: 0 16px;

    .toolbar {

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 32px;
    }

    .toolbar-actions {
      display: flex;

      justify-content: flex-end;
      gap: 8px;

    .status-dot {

      align-items: center;
      color: var(--text-secondary);
      white-space: nowrap;

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--text-tertiary);
    }

    .status-dot.success::before {
      background: var(--success);
    }

    .status-dot.warning::before {
      background: var(--warning);
    }

    .status-dot.processing::before {
      background: var(--processing);
    }

    .status-dot.error::before {
      background: var(--error);
    }

    .row-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .row-actions .ant-btn-link {
      padding: 0 !important;
      height: auto;
      color: var(--primary) !important;
      font-weight: 400 !important;
      box-shadow: none !important;
      background: transparent !important;

    .table-pagination {

      justify-content: flex-end;
      padding: 16px 0;

    .footer {

      margin-top: 12px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 20px;
      padding-top: 0;
    }

    .empty-page {
      min-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 0 8px 8px 8px;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section-title {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .drawer-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .ant-drawer-header {
      min-height: 56px;
      padding: 16px 24px !important;
      border-bottom: 1px solid #F0F0F0 !important;
    }

    .ant-drawer-body {
      padding: 24px !important;
    }

    .ant-drawer-footer {
      height: 56px;
      padding: 12px 24px !important;
      border-top: 1px solid #F0F0F0 !important;
      text-align: right;
    }

    .ant-btn-primary {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      box-shadow: none !important;
      font-weight: 400;
    }

    .ant-modal .ant-modal-content {
      padding: 0;
    }

    .ant-modal .ant-modal-header {
      border-bottom: 1px solid #F0F0F0;
      padding: 20px 24px 16px;
      margin-bottom: 0;
    }

    .ant-modal .ant-modal-body {
      padding: 24px 24px 0;
    }

    .ant-modal .ant-modal-footer {
      border-top: 1px solid #F0F0F0;
      padding: 16px 24px;
      margin-top: 0;
    }

    .ant-modal-confirm .ant-modal-body {
      padding: 24px !important;
    }

    .ant-select-selector,
    .ant-picker {
      border-radius: 4px !important;
    }

    .ant-form-item-label {
      padding-right: 0 !important;
    }

    .ant-form-item-label > label::after {
      margin-inline-start: 0 !important;
      margin-inline-end: 8px !important;
    }

    .modal-form .ant-form-item-label {
      max-width: none !important;
    }

    .modal-form .ant-form-item-control {
      flex: 1 1 0 !important;
      min-width: 0;
    }
  </style>
</head>

function StatusDot(props) {
  return <span className={`status-dot ${props.status}`}>{props.text}</span>;
}

function ShellTabs(props) {
  const items = [
    { key: 'merchant-whitelist', title: '商户白名单配置' },
    { key: 'approval-records', title: '审批记录' },
    { key: 'operation-log', title: '操作日志' },
  ].map((item) => ({
    key: item.key,
    label: (
      <Tooltip title={item.title.length > 6 ? item.title : ''}>
        <span className="tab-label">
          {item.key === props.activeTab ? <ReloadOutlined data-boss-tab-static-icon /> : null}
          <span className="tab-title">{item.title}</span>
          <CloseOutlined />
        </span>
      </Tooltip>
    ),
  }));

  return (
    <div className="tabs-area" data-boss-shell="tabs">
      <Tabs type="card" activeKey={props.activeTab} items={items} onChange={props.setActiveTab} />
    </div>
  );
}

function WhitelistPage() {
  const formHook = Form.useForm();
  const form = formHook[0];
  const modalFormHook = Form.useForm();
  const modalForm = modalFormHook[0];
  const loadingState = React.useState(false);
  const loading = loadingState[0];
  const setLoading = loadingState[1];
  const modalOpenState = React.useState(false);
  const modalOpen = modalOpenState[0];
  const setModalOpen = modalOpenState[1];
  const submittingState = React.useState(false);
  const submitting = submittingState[0];
  const setSubmitting = submittingState[1];
  const drawerOpenState = React.useState(false);
  const drawerOpen = drawerOpenState[0];
  const setDrawerOpen = drawerOpenState[1];
  const currentRowState = React.useState(whitelistRows[0]);
  const currentRow = currentRowState[0];
  const setCurrentRow = currentRowState[1];
  const checkedColumnsState = React.useState(['merchantNo', 'merchantName', 'whitelistType', 'scope', 'validPeriod', 'statusText', 'creator', 'updatedAt']);
  const checkedColumns = checkedColumnsState[0];
  const setCheckedColumns = checkedColumnsState[1];
  const queryExpandedState = React.useState(false);
  const queryExpanded = queryExpandedState[0];
  const setQueryExpanded = queryExpandedState[1];

  const runSearch = () => {
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      message.success('查询完成');
    }, 500);
  };

  const resetSearch = () => {
    form.resetFields();
    message.success('查询条件已重置');
  };

  const submitCreate = () => {
    modalForm.validateFields().then(() => {
      Modal.confirm({
        title: '提交确认',
        content: '确认提交该商户白名单配置吗？提交后将进入配置生效校验。',
        okText: '确 认',
        cancelText: '取 消',
        width: 416,
        onOk: () => {
          setSubmitting(true);
          return new Promise((resolve) => {
            setTimeout(() => {
              setSubmitting(false);
              setModalOpen(false);
              modalForm.resetFields();
              message.success('新增白名单配置成功');
              resolve();
            }, 500);
          });
        },
      });
    });
  };

  const openDetail = (record) => {
    setCurrentRow(record);
    setDrawerOpen(true);
  };

  const baseColumns = [
    { title: '商户编号', dataIndex: 'merchantNo', key: 'merchantNo', width: 150 },
    { title: '商户名称', dataIndex: 'merchantName', key: 'merchantName', width: 220 },
    { title: '白名单类型', dataIndex: 'whitelistType', key: 'whitelistType', width: 150 },
    { title: '生效范围', dataIndex: 'scope', key: 'scope', width: 120 },
    { title: '有效期', dataIndex: 'validPeriod', key: 'validPeriod', width: 210 },
    { title: '状态', dataIndex: 'statusText', key: 'statusText', width: 110, render: (_, record) => <StatusDot status={record.status} text={record.statusText} /> },
    { title: '创建人', dataIndex: 'creator', key: 'creator', width: 100 },
    { title: '更新时间', dataIndex: 'updatedAt', key: 'updatedAt', width: 170 },
  ];

  const columns = baseColumns
    .filter((item) => checkedColumns.includes(item.key))
    .concat([
      {
        title: '操作',
        key: 'action',
        fixed: 'right',
        width: 180,
