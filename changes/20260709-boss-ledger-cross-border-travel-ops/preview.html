<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --border: #E5E6EB;
      --divider: #F0F0F0;
      --text: #1F2329;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --error: #FF4D4F;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1180px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 142px;
      height: 42px;
      object-fit: contain;
      display: block;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
      cursor: pointer;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--divider);
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      font-weight: 400;
      width: 207px !important;
    }

    .sider.collapsed .ant-menu-inline-collapsed,
    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item,
    .sider.collapsed .sider-menu .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
    }

    .sider.collapsed .sider-menu .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-item .anticon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .anticon {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-inline-end: 0 !important;
      min-width: 0 !important;
      font-size: 16px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title .anticon {
      color: var(--primary) !important;
    }

    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: var(--selected-bg) !important;
      position: relative;
    }

    .sider-menu .ant-menu-item-selected::after {
      border-inline-end: 2px solid var(--primary) !important;
    }

    .collapse-control {
      height: 48px;
      border-top: 1px solid #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .work-body {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .tab-strip {
      height: 48px;
      padding: 4px 16px 0;
      background: var(--page-bg);
      flex: 0 0 auto;
    }

    .boss-tabs,
    .boss-tabs .ant-tabs-nav {
      height: 44px;
      margin: 0 !important;
    }

    .boss-tabs .ant-tabs-nav::before {
      border-bottom: 0 !important;
    }

    .boss-tabs .ant-tabs-tab {
      height: 44px !important;
      padding: 0 12px !important;
      margin: 0 !important;
      border: 0 !important;
      background: #EDEDED !important;
      border-radius: 4px 4px 0 0 !important;
      color: var(--text-secondary);
    }

    .boss-tabs .ant-tabs-tab + .ant-tabs-tab::before {
      content: "";
      width: 1px;
      height: 24px;
      background: #E6E6E6;
      position: absolute;
      left: -1px;
      top: 10px;
    }

    .boss-tabs .ant-tabs-tab-active {
      background: #fff !important;
      border-radius: 8px 8px 0 0 !important;
    }

    .boss-tabs .ant-tabs-tab-active::before,
    .boss-tabs .ant-tabs-tab-active + .ant-tabs-tab::before {
      display: none;
    }

    .boss-tabs .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .boss-tabs .ant-tabs-tab-remove {
      color: var(--text-tertiary) !important;
      margin-left: 4px !important;
    }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 112px;
      white-space: nowrap;
    }

    .tab-label .anticon {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px 0;
      background: var(--page-bg);
    }

    .query-panel,
    .table-panel,
    .module-panel {
      background: #fff;
      border: 0;
      border-radius: 8px;
    }

    .query-panel {
      padding: 16px;
      border-top-left-radius: 0;
    }

    .query-panel + .table-panel,
    .query-panel + .module-panel,
    .table-panel + .module-panel,
    .module-panel + .table-panel {
      margin-top: 16px;
    }

    .query-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .query-grid .ant-form-item {
      margin-bottom: 0;
    }

    .query-grid .ant-form-item-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .query-grid .ant-form-item-label {
      flex: 0 0 auto;
      padding-right: 0;
    }

    .query-grid .ant-form-item-label > label {
      margin-right: 8px;
      color: var(--text-secondary);
    }

    .query-grid .ant-form-item-control {
      flex: 1 1 auto;
      min-width: 0;
    }

    .query-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      min-width: 0;
      grid-column: 3 / 4;
    }

    .query-actions .expand-btn {
      padding-inline: 0;
      color: var(--text-secondary);
    }

    .query-actions .expand-btn .anticon {
      margin-right: 4px;
    }

    .table-panel {
      overflow: hidden;
    }

    .table-stats {
      padding: 16px 16px 0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      background: transparent;
      padding: 0;
    }

    .stat-item {
      min-width: 0;
      padding: 16px;
      background: #F6F6F6;
    }

    .stat-title {
      color: var(--text-tertiary);
      font-size: 14px;
      line-height: 22px;
    }

    .stat-value {
      margin-top: 4px;
      color: rgba(0, 0, 0, .85);
      font-size: 22px;
      line-height: 30px;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      min-height: 64px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .toolbar-title {
      height: 32px;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 500;
      color: rgba(0, 0, 0, .85);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .column-setting-btn {
      width: 32px;
      height: 32px;
      background: #FAFAFA;
      color: var(--text-secondary);
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .column-setting-btn:hover,
    .column-setting-btn:focus {
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .table-panel .ant-table-wrapper {
      padding: 0 16px;
    }

    .ant-table-thead > tr > th {
      font-weight: 500 !important;
      white-space: nowrap;
    }

    .ant-table-cell {
      font-weight: 400;
    }

    .amount-cell,
    .amount-cell .ant-table-cell {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
    }

    .operation-column .ant-btn-link {
      padding: 0 !important;
      height: 22px;
      font-weight: 400;
    }

    .operation-column .primary-action {
      color: var(--primary);
      font-weight: 400;
    }

    .operation-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .table-pagination {
      padding: 16px;
      display: flex;
      justify-content: flex-end;
      background: #fff;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }

    .status-dot.success::before { background: var(--success); }
    .status-dot.warning::before { background: var(--warning); }
    .status-dot.error::before { background: var(--error); }
    .status-dot.processing::before { background: var(--processing); }
    .status-dot.default::before { background: var(--text-tertiary); }

    .two-line {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .primary-text {
      color: var(--text);
      line-height: 22px;
    }

    .secondary-text {
      color: var(--text-tertiary);
      line-height: 20px;
      font-size: 12px;
    }

    .risk-high { color: var(--error); }
    .risk-mid { color: var(--warning); }

    .drawer-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .drawer-title-text {
      font-size: 16px;
      font-weight: 500;
    }

    .drawer-title-close {
      color: var(--text-tertiary);
    }

    .drawer-section {
      margin-bottom: 24px;
    }

    .drawer-section:last-child {
      margin-bottom: 0;
    }

    .drawer-section-title {
      margin-bottom: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, .85);
    }

    .modal-form .ant-form-item-label {
      padding-right: 0;
    }

    .modal-form .ant-form-item-label > label {
      margin-right: 8px;
    }

    .page-footer {
      height: 24px;
      padding-top: 16px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12px;
    }
  </style>
</head>

          <QueryPanel fields={queryFields} form={form} loading={loading} onQuery={onQuery} />
          <section className="table-panel">
            <TableStats items={[
              { title: '支付成功金额(元)', value: '8,742,913.28' },
              { title: '异常待核验(笔)', value: '9' },
              { title: '锁汇失败(笔)', value: '4' },
              { title: '服务费合计(元)', value: '64,217.32' },
              { title: '汇差合计(元)', value: '3,482.11' },
            ]} />
            <div className="toolbar">
              <div className="toolbar-title">支付流水列表</div>

                <Button type="primary" onClick={() => message.success('下载任务已创建')}>下载Excel</Button>
                <ColumnSetting options={tools.options} value={tools.visible} onChange={tools.setVisible} />
              </div>
            </div>
            <Table loading={loading} rowKey="key" columns={tools.merged} dataSource={paymentRows} pagination={false} scroll={{ x: 1480 }} />
            <div className="table-pagination"><Pagination current={1} pageSize={10} total={927} showTotal={(total) => `共 ${total} 条`} locale={{ items_per_page: '条/页', jump_to: '跳至', jump_to_confirm: '确定', page: '页' }} /></div>
          </section>
        </>
      );
    }

    function DetailDrawer({ open, title, onClose }) {
      return (
        <Drawer
          title={(
            <div className="drawer-title-bar">
              <span className="drawer-title-text">{title}</span>
              <Button className="drawer-title-close" type="text" icon={<CloseOutlined />} onClick={onClose} />
            </div>
          )}
          width={760}
          open={open}
          onClose={onClose}
          closable={false}
          footer={<Space style={{ display: 'flex', justifyContent: 'flex-end' }}><Button onClick={onClose}>取 消</Button><Button type="primary" onClick={onClose}>确 认</Button></Space>}
        >
          <div className="drawer-section">
            <div className="drawer-section-title">订单基础信息</div>
            <Descriptions column={3} size="small">
              <Descriptions.Item label="订单编号">TRV202607090018</Descriptions.Item>
              <Descriptions.Item label="目的地">日本东京</Descriptions.Item>
              <Descriptions.Item label="出行日期">2026-07-15</Descriptions.Item>
              <Descriptions.Item label="游客">林可欣</Descriptions.Item>
              <Descriptions.Item label="订单状态"><StatusDot status="warning" text="凭证待交付" /></Descriptions.Item>
              <Descriptions.Item label="风险等级"><RiskTag status="error" text="高风险" /></Descriptions.Item>
            </Descriptions>
          </div>
          <div className="drawer-section">
            <div className="drawer-section-title">履约与材料</div>
            <Descriptions column={2} size="small">
              <Descriptions.Item label="供应商">JPN LocalPass</Descriptions.Item>
              <Descriptions.Item label="确认状态"><StatusDot status="success" text="确认成功" /></Descriptions.Item>
              <Descriptions.Item label="凭证状态"><StatusDot status="warning" text="未交付" /></Descriptions.Item>
              <Descriptions.Item label="材料状态"><StatusDot status="warning" text="待审核" /></Descriptions.Item>
            </Descriptions>
          </div>
          <div className="drawer-section">
            <div className="drawer-section-title">支付与汇率</div>
            <Descriptions column={3} size="small">
              <Descriptions.Item label="支付币种">JPY</Descriptions.Item>
              <Descriptions.Item label="原币金额">92,000.00</Descriptions.Item>
              <Descriptions.Item label="人民币金额">4,532.84</Descriptions.Item>
              <Descriptions.Item label="汇率">0.04927</Descriptions.Item>
              <Descriptions.Item label="锁汇状态"><StatusDot status="success" text="已锁汇" /></Descriptions.Item>
              <Descriptions.Item label="支付状态"><StatusDot status="success" text="支付成功" /></Descriptions.Item>
            </Descriptions>
          </div>
          <div className="drawer-section">
            <div className="drawer-section-title">状态轨迹</div>
            <Timeline
              items={[
                { children: '2026-07-09 09:18 支付成功，生成跨境旅游订单' },
                { children: '2026-07-09 09:24 向供应商发起资源确认' },
                { children: '2026-07-09 10:08 供应商确认成功，待交付出行凭证' },
                { color: 'red', children: '2026-07-09 10:42 系统标记出行临近高风险' },
              ]}
            />
          </div>
        </Drawer>
      );
    }

    function ProcessModal({ open, title, onCancel }) {
      const [form] = Form.useForm();
      const { message } = App.useApp();
      const isReject = title === '审核驳回';
      const isNotice = title === '补材料通知';
      const isVerify = title === '支付异常核验';
      const isManual = title === '转人工确认';
      return (
        <Modal
          title={title}
          open={open}
          onCancel={onCancel}
          width={656}
          okText="确 认"
          cancelText="取 消"
          onOk={() => {
            form.validateFields().then(() => {
              message.success(`${title}已提交`);
              onCancel();
              form.resetFields();
            });
          }}
        >
          <Form className="modal-form" form={form} layout="horizontal" labelCol={{ flex: '88px' }}>
            {isManual && (
              <Form.Item label="人工处理人" name="operator" rules={[{ required: true, message: '请选择人工处理人' }]}>
                <Select placeholder="请选择人工处理人" options={[{ label: '履约一组-赵倩', value: 'zq' }, { label: '履约二组-钱宇', value: 'qy' }]} />
              </Form.Item>
            )}
            {isReject && (
              <Form.Item label="审核结果" name="reviewResult" initialValue="reject" rules={[{ required: true, message: '请选择审核结果' }]}>
                <Radio.Group options={[{ label: '审核驳回', value: 'reject' }, { label: '待补材料', value: 'supplement' }]} />
              </Form.Item>
            )}
            {isNotice && (
              <>
                <Form.Item label="补材料项" name="items" rules={[{ required: true, message: '请选择补材料项' }]}>
                  <Checkbox.Group options={['护照首页', '签证页', '保险凭证', '游客授权书']} />
                </Form.Item>
                <Form.Item label="通知渠道" name="channels" rules={[{ required: true, message: '请选择通知渠道' }]}>
                  <Checkbox.Group options={['短信', '邮件', '站内信']} />
                </Form.Item>
              </>
            )}
            {isVerify && (
              <Form.Item label="核验结论" name="verifyResult" rules={[{ required: true, message: '请选择核验结论' }]}>
                <Radio.Group options={[{ label: '正常', value: 'normal' }, { label: '异常', value: 'abnormal' }, { label: '待进一步核验', value: 'pending' }]} />
              </Form.Item>
            )}
            <Form.Item label="处理备注" name="remark" rules={[{ required: true, message: '请输入处理备注' }]}>
              <TextArea rows={4} placeholder="请输入处理备注" />
            </Form.Item>
          </Form>
        </Modal>
      );
    }

    function CrossBorderTravelOpsPage() {
      const [collapsed, setCollapsed] = React.useState(false);
      const [activePage, setActivePage] = React.useState('orders');
      const [openKeys, setOpenKeys] = React.useState(MENU_GROUPS.travel.openKeys);
      const [tabs, setTabs] = React.useState(['orders']);
      const [drawerOpen, setDrawerOpen] = React.useState(false);
      const [drawerTitle, setDrawerTitle] = React.useState('订单详情');
      const [processOpen, setProcessOpen] = React.useState(false);
      const [processTitle, setProcessTitle] = React.useState('处理');
      const activePrimary = PAGE_CONFIG[activePage].primary;

      const activatePage = (pageKey) => {
        setActivePage(pageKey);
        setOpenKeys(MENU_GROUPS[PAGE_CONFIG[pageKey].primary].openKeys);
        setTabs((prev) => prev.includes(pageKey) ? prev : [...prev, pageKey]);
      };

      const openDrawer = (title) => {
        setDrawerTitle(title);
        setDrawerOpen(true);
      };

      const openProcess = (title) => {
        setProcessTitle(title);
        setProcessOpen(true);
      };

      const removeTab = (targetKey) => {
        if (tabs.length === 1) return;
        const nextTabs = tabs.filter((key) => key !== targetKey);
        setTabs(nextTabs);
        if (activePage === targetKey) {
          activatePage(nextTabs[nextTabs.length - 1]);
        }
      };

      const tabItems = tabs.map((key) => ({
        key,
        closable: tabs.length > 1,
        label: (
          <Tooltip title={PAGE_CONFIG[key].title.length > 6 ? PAGE_CONFIG[key].title : ''}>
            <span className="tab-label">
              {activePage === key && <ReloadOutlined />}
              <span className="tab-title">{PAGE_CONFIG[key].title}</span>
            </span>
          </Tooltip>
        ),
      }));

      return (
        <div className="boss-page">
          <div className="topbar">
            <div>上次登录时间：2026-07-09 09:18:32　登录 IP：10.24.18.66　当前身份：跨境旅游运营主管</div>
            <div>10080090899 · Boss Ledger 商户后台　帮助中心　消息</div>
          </div>
          <header className="primary-nav">
            <div className="logo-zone"><img className="logo" src="./assets/boss-ledger-logo.svg" alt="老板管账" /></div>
            <nav className="primary-items">
              {PRIMARY_ITEMS.map((item) => (
                <div key={item.key} className={`primary-item ${activePrimary === item.key ? 'active' : ''}`} onClick={() => activatePage(item.defaultPage)}>
                  {item.label}
                </div>
              ))}
            </nav>
          </header>
          <div className="shell">
            <aside className={`sider ${collapsed ? 'collapsed' : ''}`}>
              <div className="sider-menu">
                <Menu
                  mode="inline"
                  inlineCollapsed={collapsed}
                  inlineCollapsedWidth={48}
                  selectedKeys={[activePage]}
                  openKeys={collapsed ? [] : openKeys}
                  onOpenChange={setOpenKeys}
                  onClick={({ key }) => activatePage(key)}
                  items={MENU_GROUPS[activePrimary].items}
                />
              </div>
              <div className="collapse-control" onClick={() => setCollapsed(!collapsed)}>
                {collapsed ? <MenuUnfoldOutlined /> : <MenuFoldOutlined />}
              </div>
            </aside>
            <main className="workspace">
              <div className="work-body">
                <div className="tab-strip">
                  <Tabs
                    className="boss-tabs"
                    type="editable-card"
                    hideAdd
                    activeKey={activePage}
                    onChange={activatePage}
                    onEdit={(targetKey, action) => action === 'remove' && removeTab(targetKey)}
                    items={tabItems}
                  />
                </div>
                <section className="content">
                  {activePage === 'orders' && <OrdersPage openDrawer={openDrawer} />}
                  {activePage === 'fulfillment' && <FulfillmentPage openDrawer={openDrawer} openProcess={openProcess} />}
                  {activePage === 'materials' && <MaterialsPage openDrawer={openDrawer} openProcess={openProcess} />}
                  {activePage === 'payments' && <PaymentsPage openDrawer={openDrawer} openProcess={openProcess} />}
                  <footer className="page-footer">© 2026 易宝支付有限公司 版权所有</footer>
                </section>
              </div>
            </main>
          </div>
          <DetailDrawer open={drawerOpen} title={drawerTitle} onClose={() => setDrawerOpen(false)} />
          <ProcessModal open={processOpen} title={processTitle} onCancel={() => setProcessOpen(false)} />
        </div>
      );
    }

    function Root() {
      return (
        <ConfigProvider
          locale={(antd.locales && antd.locales.zh_CN) || (antd.locale && antd.locale.zh_CN)}
          theme={{
            cssVar: true,
            token: {
              colorPrimary: '#F36046',
              colorLink: '#F36046',
              colorInfo: '#F36046',
              lineWidth: 1,
              controlHeight: 32,
              borderRadius: 4,
            },
          }}
        >
          <App>
            <CrossBorderTravelOpsPage />
          </App>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
