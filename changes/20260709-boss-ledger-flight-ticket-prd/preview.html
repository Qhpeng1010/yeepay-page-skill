<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Ledger - 机票业务运营后台 PRD</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --border: #E5E6EB;
      --divider: #F0F0F0;
      --text: #1F2329;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --error: #FF4D4F;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1120px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo-box {
      width: 128px;
      height: 40px;
      border-radius: 4px;
      background: linear-gradient(135deg, #F36046, #FF7A66);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
      cursor: pointer;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--divider);
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      font-weight: 400;
      width: 207px !important;
    }

    .sider.collapsed .ant-menu-inline-collapsed,
    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item,
    .sider.collapsed .sider-menu .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
    }

    .sider.collapsed .sider-menu .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-item .anticon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .anticon {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-inline-end: 0 !important;
      min-width: 0 !important;
      font-size: 16px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title .anticon {
      color: var(--primary) !important;
    }

    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: var(--selected-bg) !important;
    }

    .sider-menu .ant-menu-item-selected::after {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--primary);
      border-radius: 0;
      transform: none;
      opacity: 1;
    }

    .collapse-control {
      height: 48px;
      border-top: 1px solid #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
      overflow: hidden;
    }

    .tabs-strip {
      height: 48px;
      padding: 4px 16px 0;
      display: flex;
      align-items: flex-end;
      background: var(--page-bg);
      flex: 0 0 auto;
    }

    .tabs-strip .ant-tabs {
      width: 100%;
    }

    .tabs-strip .ant-tabs-nav {
      margin: 0 !important;
    }

    .tabs-strip .ant-tabs-tab {
      height: 40px;
      padding: 0 12px !important;
      background: #f7f7f7;
      border: 1px solid var(--divider) !important;
      border-bottom: 0 !important;
      border-radius: 4px 4px 0 0 !important;
      margin: 0 !important;
      color: var(--text-secondary);
    }

    .tabs-strip .ant-tabs-tab-active {
      background: #fff !important;
      border-radius: 8px 8px 0 0 !important;
    }

    .tabs-strip .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .tabs-strip .ant-tabs-ink-bar {
      display: none;
    }

    .content-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px;
      background: var(--page-bg);
    }

    .content-inner {
      padding-bottom: 0;
    }

    .module {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .module.first {
      border-top-left-radius: 0;
    }

    .module-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
    }

    .module-title h2 {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: rgba(0, 0, 0, .85);
    }

    .muted {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .stat-tile {
      background: #F6F6F6;
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
    }

    .stat-label {
      color: rgba(0, 0, 0, .45);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .stat-value {
      font-size: 22px;
      line-height: 30px;
      font-variant-numeric: tabular-nums;
      color: rgba(0, 0, 0, .85);
      font-weight: 500;
    }

    .section-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text-secondary);
    }

    .section-list li {
      margin: 6px 0;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .flow-step {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-height: 96px;
    }

    .flow-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--selected-bg);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .flow-title {
      font-weight: 500;
      margin-bottom: 4px;
      color: rgba(0, 0, 0, .85);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: 1px;
    }

    .dot-warning { background: var(--warning); }
    .dot-processing { background: var(--processing); }
    .dot-success { background: var(--success); }
    .dot-error { background: var(--error); }
    .dot-default { background: #86909C; }

    .footer {
      height: 24px;
      line-height: 18px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .ant-btn-primary {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
    }

    .ant-btn-primary:hover {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
    }

    .ant-table-cell.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .action-button.ant-btn-link {
      padding-left: 0 !important;
      padding-right: 8px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script type="text/babel">
    const {
      ConfigProvider,
      App,
      Button,
      Descriptions,
      Dropdown,
      Menu,
      Space,
      Table,
      Tabs,
      Tag,
      Tooltip,
      message,
      theme
    } = antd;

    const AntIcons = window.icons || window.antdIcons || window.AntDesignIcons || {};

    const {
      AuditOutlined,
      BellOutlined,
      CloseOutlined,
      DashboardOutlined,
      FileSearchOutlined,
      MenuFoldOutlined,
      MenuUnfoldOutlined,
      ProfileOutlined,
      ReloadOutlined,
      SettingOutlined,
      SwapOutlined,
      WalletOutlined
    } = AntIcons;

    dayjs.locale('zh-cn');

    const statusColor = {
      '待出票': 'dot-warning',
      '出票中': 'dot-processing',
      '出票成功': 'dot-success',
      '出票失败': 'dot-error',
      '航变待处理': 'dot-warning',
      '对账差异': 'dot-error'
    };

    const orderRows = [
      {
        key: '1',
        orderNo: 'FT202607090001',
        passenger: '张三',
        route: '上海虹桥 - 北京首都',
        flight: 'MU5110',
        supplier: '航旅易达',
        status: '待出票',
        ticketStatus: '待出票',
        payAmount: '1280.00',
        purchaseAmount: '1215.00',
        departDate: '2026-07-20 08:45'
      },
      {
        key: '2',
        orderNo: 'FT202607090018',
        passenger: '李四',
        route: '杭州萧山 - 广州白云',
        flight: 'CZ3802',
        supplier: '华东航服',
        status: '出票失败',
        ticketStatus: '出票失败',
        payAmount: '960.00',
        purchaseAmount: '910.00',
        departDate: '2026-07-21 13:20'
      },
      {
        key: '3',
        orderNo: 'FT202607090027',
        passenger: '王五',
        route: '深圳宝安 - 成都天府',
        flight: '3U8706',
        supplier: '民航分销',
        status: '航变待处理',
        ticketStatus: '出票成功',
        payAmount: '1460.00',
        purchaseAmount: '1392.00',
        departDate: '2026-07-22 19:10'
      }
    ];

    const columns = [
      { title: '订单编号', dataIndex: 'orderNo', key: 'orderNo', width: 150 },
      { title: '乘机人', dataIndex: 'passenger', key: 'passenger', width: 90 },
      { title: '航程', dataIndex: 'route', key: 'route', width: 180 },
      { title: '航班号', dataIndex: 'flight', key: 'flight', width: 100 },
      { title: '供应商', dataIndex: 'supplier', key: 'supplier', width: 110 },
      {
        title: '订单状态',
        dataIndex: 'status',
        key: 'status',
        width: 120,
        render: (value) => <span><span className={`status-dot ${statusColor[value] || 'dot-default'}`}></span>{value}</span>
      },
      {
        title: '支付金额(元)',
        dataIndex: 'payAmount',
        key: 'payAmount',
        width: 120,
        className: 'amount'
      },
      {
        title: '采购金额(元)',
        dataIndex: 'purchaseAmount',
        key: 'purchaseAmount',
        width: 120,
        className: 'amount'
      },
      { title: '出行时间', dataIndex: 'departDate', key: 'departDate', width: 150 },
      {
        title: '操作',
        key: 'action',
        fixed: 'right',
        width: 170,
        render: (_, record) => (
          <Space size={0}>
            <Button type="link" className="action-button" onClick={() => message.info(`查看 ${record.orderNo}`)}>查看</Button>
            <Button type="link" className="action-button" onClick={() => message.info(`处理 ${record.orderNo}`)}>处理</Button>
            <Dropdown
              menu={{ items: [{ key: 'log', label: '操作日志' }, { key: 'export', label: '下载凭证' }] }}
            >
              <Button type="link" className="action-button">更多</Button>
            </Dropdown>
          </Space>
        )
      }
    ];

    function Header() {
      return (
        <>
          <div className="topbar">
            <span>上次登录时间：2026-07-09 15:42:18</span>
            <span>登录 IP：10.20.18.36　当前身份：航旅运营主管</span>
          </div>
          <div className="primary-nav">
            <div className="logo-zone">
              <div className="logo-box">Boss Ledger</div>
            </div>
            <div className="primary-items">
              <div className="primary-item active">航旅业务</div>
              <div className="primary-item">订单中心</div>
              <div className="primary-item">财务对账</div>
              <div className="primary-item">系统管理</div>
            </div>
          </div>
        </>
      );
    }

    function Sidebar({ collapsed, setCollapsed }) {
      const items = [
        {
          key: 'flight',
          icon: <FileSearchOutlined />,
          label: '机票运营',
          children: [
            { key: 'prd', label: '业务 PRD' },
            { key: 'orders', label: '机票订单查询' },
            { key: 'ticketing', label: '出票监控' }
          ]
        },
        {
          key: 'service',
          icon: <SwapOutlined />,
          label: '退改签协同',
          children: [
            { key: 'refund', label: '退票处理' },
            { key: 'change', label: '改签处理' },
            { key: 'flightChange', label: '航变通知' }
          ]
        },
        {
          key: 'finance',
          icon: <WalletOutlined />,
          label: '供应商对账',
          children: [
            { key: 'reconcile', label: '对账明细' },
            { key: 'settlement', label: '结算批次' }
          ]
        }
      ];

      return (
        <aside className={`sider ${collapsed ? 'collapsed' : ''}`}>
          <div className="sider-menu">
            <Menu
              mode="inline"
              inlineCollapsed={collapsed}
              selectedKeys={['prd']}
              defaultOpenKeys={['flight', 'service', 'finance']}
              items={items}
            />
          </div>
          <Tooltip title={collapsed ? '展开导航' : '收起导航'}>
            <div className="collapse-control" onClick={() => setCollapsed(!collapsed)}>
              {collapsed ? <MenuUnfoldOutlined /> : <MenuFoldOutlined />}
            </div>
          </Tooltip>
        </aside>
      );
    }

    function SummaryModule() {
      return (
        <section className="module first">
          <div className="module-title">
            <h2>机票业务运营后台 PRD</h2>
            <Space>
              <Tag color="processing">Product Only</Tag>
              <Tag color="warning">Boss Ledger</Tag>
              <Button onClick={() => message.info('当前预览为 PRD 摘要，不生成生产代码')}>查看说明</Button>
              <Button type="primary" onClick={() => message.success('已记录评审动作')}>开始评审</Button>
            </Space>
          </div>
          <div className="summary-grid">
            <div className="stat-tile">
              <div className="stat-label">核心业务对象(类)</div>
              <div className="stat-value">10</div>
            </div>
            <div className="stat-tile">
              <div className="stat-label">核心状态(个)</div>
              <div className="stat-value">17</div>
            </div>
            <div className="stat-tile">
              <div className="stat-label">验收标准(条)</div>
              <div className="stat-value">14</div>
            </div>
            <div className="stat-tile">
              <div className="stat-label">高风险操作(类)</div>
              <div className="stat-value">5</div>
            </div>
          </div>
          <Descriptions
            bordered
            size="small"
            column={2}
            items={[
              { key: 'request', label: '原始需求', children: '/yeepay:prd 输一个机票业务的prd' },
              { key: 'theme', label: '目标主题', children: 'Boss Ledger 运营后台' },
              { key: 'object', label: '核心对象', children: '机票订单、出票单、退改签申请、航变通知、供应商账单' },
              { key: 'scope', label: '本次范围', children: '订单查询、出票监控、退改签、航变、供应商对账、权限和异常' }
            ]}
          />
        </section>
      );
    }

    function GoalsModule() {
      return (
        <section className="module">
          <div className="module-title">
            <h2>需求目标与范围</h2>
            <span className="muted">PRD 摘要</span>
          </div>
          <div className="flow">
            <div className="flow-step">
              <div className="flow-index">1</div>
              <div className="flow-title">订单统一查询</div>
              <div className="muted">支持订单号、乘机人、航班、航司、供应商、状态和日期检索。</div>
            </div>
            <div className="flow-step">
              <div className="flow-index">2</div>
              <div className="flow-title">出票监控闭环</div>
              <div className="muted">识别待出票、出票失败、出票超时和人工介入订单。</div>
            </div>
            <div className="flow-step">
              <div className="flow-index">3</div>
              <div className="flow-title">退改签处理</div>
              <div className="muted">覆盖申请、审核、供应商处理、补差支付、退款和结果通知。</div>
            </div>
            <div className="flow-step">
              <div className="flow-index">4</div>
              <div className="flow-title">供应商对账</div>
              <div className="muted">核对采购金额、退票款、改签差额、服务费和结算状态。</div>
            </div>
          </div>
        </section>
      );
    }

    function RequirementModule() {
      return (
        <section className="module">
          <div className="module-title">
            <h2>关键规则</h2>
            <Space>
              <Button>下载Excel</Button>
              <Tooltip title="列设置">
                <Button icon={<SettingOutlined />} />
              </Tooltip>
            </Space>
          </div>
          <Descriptions
            size="small"
            bordered
            column={3}
            items={[
              { key: 'role1', label: '航旅运营', children: '订单查询、出票监控、异常处理、航变跟进' },
              { key: 'role2', label: '客服人员', children: '用户订单查询、退改签协助、客诉处理' },
              { key: 'role3', label: '财务人员', children: '供应商账单核对、差异标记、结算确认' },
              { key: 'sensitive1', label: '敏感信息', children: '手机号、证件号默认脱敏，查看完整信息记录日志' },
              { key: 'sensitive2', label: '高风险操作', children: '出票重试、退款、金额调整、结算确认需二次确认' },
              { key: 'sensitive3', label: '导出权限', children: '订单明细和供应商账单下载需专门权限' }
            ]}
          />
        </section>
      );
    }

    function TableModule() {
      return (
        <section className="module">
          <div className="module-title">
            <h2>核心列表字段示例</h2>
            <Space>
              <Button onClick={() => message.info('已按当前条件查询')}>查 询</Button>
              <Button>重 置</Button>
              <Tooltip title="列设置">
                <Button icon={<SettingOutlined />} />
              </Tooltip>
            </Space>
          </div>
          <Table
            rowKey="key"
            columns={columns}
            dataSource={orderRows}
            scroll={{ x: 1350 }}
            pagination={{ current: 1, pageSize: 10, total: 3, showSizeChanger: false }}
            size="middle"
          />
        </section>
      );
    }

    function AcceptanceModule() {
      return (
        <section className="module">
          <div className="module-title">
            <h2>验收重点</h2>
            <span className="muted">从完整 proposal.md 提炼</span>
          </div>
          <ul className="section-list">
            <li>当运营人员输入订单编号并点击“查 询”时，系统应返回匹配的机票订单记录。</li>
            <li>当待出票订单点击“重试出票”时，系统应展示二次确认；确认后订单进入出票中并记录操作日志。</li>
            <li>当订单已出票成功时，系统不应展示“取消订单”操作，应展示退票和改签入口。</li>
            <li>当改签申请存在补收差额且用户未支付时，系统应禁止提交供应商改签。</li>
            <li>当平台金额与供应商账单金额不一致时，系统应标记“对账差异”，并禁止直接确认结算。</li>
            <li>当无导出权限用户进入页面时，下载Excel操作应不可见或不可点击，并给出权限不足反馈。</li>
          </ul>
        </section>
      );
    }

    function MainContent() {
      return (
        <div className="workspace">
          <div className="tabs-strip">
            <Tabs
              type="editable-card"
              hideAdd
              activeKey="prd"
              items={[
                {
                  key: 'prd',
                  label: <span><ReloadOutlined /> 业务 PRD</span>,
                  closable: false
                },
                {
                  key: 'orders',
                  label: '机票订单查询',
                  closable: true
                },
                {
                  key: 'ticketing',
                  label: '出票监控',
                  closable: true
                }
              ]}
              onChange={(key) => message.info(`切换到 ${key}`)}
              onEdit={() => message.info('最后一个 Tab 不可关闭')}
            />
          </div>
          <div className="content-scroll">
            <div className="content-inner">
              <SummaryModule />
              <GoalsModule />
              <RequirementModule />
              <TableModule />
              <AcceptanceModule />
              <div className="footer">© 2026 易宝支付有限公司 版权所有</div>
            </div>
          </div>
        </div>
      );
    }

    function FlightPrdPreview() {
      const [collapsed, setCollapsed] = React.useState(false);

      return (
        <ConfigProvider
          locale={(antd.locales && antd.locales.zh_CN) || (antd.locale && antd.locale.zh_CN)}
          theme={{
            cssVar: true,
            token: {
              colorPrimary: '#F36046',
              borderRadius: 4,
              lineWidth: 1,
              fontSize: 14
            },
            components: {
              Button: { borderRadius: 4 },
              Card: { borderRadiusLG: 8 },
              Tabs: { itemSelectedColor: '#F36046', inkBarColor: '#F36046' }
            },
            algorithm: theme.defaultAlgorithm
          }}
        >
          <App>
            <div className="boss-page">
              <Header />
              <div className="shell">
                <Sidebar collapsed={collapsed} setCollapsed={setCollapsed} />
                <MainContent />
              </div>
            </div>
          </App>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FlightPrdPreview />);
  </script>
</body>
