<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Ledger - 酒店民宿运营后台</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --border: #E5E6EB;
      --divider: #F0F0F0;
      --text: #1F2329;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --error: #FF4D4F;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1120px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 128px;
      height: 40px;
      display: block;
      object-fit: contain;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
      cursor: pointer;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--divider);
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      font-weight: 400;
      width: 207px !important;
    }

    .sider.collapsed .ant-menu-inline-collapsed,
    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item,
    .sider.collapsed .sider-menu .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
    }

    .sider.collapsed .sider-menu .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-item .anticon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .anticon {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-inline-end: 0 !important;
      min-width: 0 !important;
      font-size: 16px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title .anticon {
      color: var(--primary) !important;
    }

    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: var(--selected-bg) !important;
    }

    .sider-menu .ant-menu-item-selected::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--primary);
    }

    .collapse-control {
      height: 48px;
      border-top: 1px solid #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 16px;
      color: var(--text-tertiary);
      cursor: pointer;
    }

    .sider.collapsed .collapse-control {
      justify-content: center;
      padding-left: 0;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .work-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .tab-strip {
      height: 48px;
      flex: 0 0 auto;
      padding-top: 4px;
      padding-left: 16px;
      background: var(--page-bg);
      box-sizing: border-box;
    }

    .boss-tabs.ant-tabs {
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav {
      margin: 0 !important;
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav::before {
      border-bottom: 0 !important;
    }

    .boss-tabs .ant-tabs-tab {
      height: 44px;
      margin: 0 !important;
      padding: 0 12px !important;
      background: #eee !important;
      border: 0 !important;
      border-radius: 4px 4px 0 0 !important;
      color: var(--text-secondary);
    }

    .boss-tabs .ant-tabs-tab-active {
      background: #fff !important;
      border-radius: 8px 8px 0 0 !important;
    }

    .boss-tabs .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 0;
      max-width: 144px;
    }

    .tab-label .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-label .anticon {
      color: #B8B8B8;
      font-size: 14px;
      flex: 0 0 auto;
      margin-inline-end: 8px;
    }

    .boss-tabs .ant-tabs-tab-remove {
      color: #B8B8B8 !important;
      margin-left: 4px !important;
    }

    .boss-tabs .ant-tabs-ink-bar {
      display: none;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px 16px;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .query-panel,
    .module-panel,
    .table-panel {
      background: #fff;
      border-radius: 8px;
    }

    .query-panel {
      padding: 16px;
      border-radius: 0 8px 8px 8px;
      flex: 0 0 auto;
    }

    .query-panel .ant-form-item {
      margin: 0;
    }

    .ant-form-item-label > label {
      column-gap: 8px;
    }

    .ant-form-horizontal .ant-form-item-label,
    .ant-form-inline .ant-form-item-label {
      padding-inline-end: 8px !important;
    }

    .ant-form-vertical .ant-form-item-label {
      padding-bottom: 8px;
    }

    .ant-form-item-label > label::after {
      margin-inline-start: 0 !important;
      margin-inline-end: 0 !important;
    }

    .query-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .query-grid .ant-form-item {
      min-width: 0;
    }

    .query-grid .ant-form-item-row {
      column-gap: 8px;
      flex-wrap: nowrap;
    }

    .query-grid .ant-form-item-label {
      flex: 0 0 auto;
      padding-inline-end: 0;
      margin-right: 0;
    }

    .query-grid .ant-form-item-control {
      flex: 1 1 auto;
      min-width: 0;
    }

    .query-grid .ant-picker,
    .query-grid .ant-select,
    .query-grid .ant-input-affix-wrapper {
      width: 100%;
    }

    .query-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      column-gap: 8px;
      min-width: 0;
      grid-column: 3;
      justify-self: end;
    }

    .query-toggle {
      padding-left: 0 !important;
      padding-right: 8px !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .query-toggle:hover,
    .query-toggle:focus {
      background: transparent !important;
    }

    .analysis-filter {
      background: #fff;
      border-radius: 0 8px 8px 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: 0 0 auto;
    }

    .analysis-filter-left,
    .analysis-filter-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .module-panel {
      padding: 16px;
      flex: 0 0 auto;
    }

    .section-grid {
      display: grid;
      gap: 16px;
      flex: 0 0 auto;
    }

    .section-grid.two {
      grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr);
    }

    .section-grid.equal {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .module-title {
      margin-bottom: 16px;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stats-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stat-box {
      background: #F6F6F6;
      border-radius: 6px;
      padding: 16px;
      min-height: 96px;
    }

    .stat-box .ant-statistic-title {
      color: var(--text-tertiary);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-box .ant-statistic-content {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stats-grid.plain .stat-box {
      background: transparent;
      border-radius: 0;
      padding: 0 16px;
      min-height: 76px;
      border-right: 1px solid var(--divider);
    }

    .stats-grid.plain .stat-box:last-child {
      border-right: 0;
    }

    .overview-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      flex: 0 0 auto;
    }

    .overview-metrics.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .overview-metric-card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      min-height: 96px;
    }

    .overview-metric-card .ant-statistic-title {
      color: var(--text-tertiary);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .overview-metric-card .ant-statistic-content {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stats-inline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 22px;
    }

    .stats-inline-item {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .stats-inline-item + .stats-inline-item::before {
      content: "｜";
      color: var(--text-tertiary);
      margin: 0 8px;
    }

    .stats-inline-value {
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .trend-line {
      margin-top: 8px;
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .trend-line.up strong {
      color: var(--success);
    }

    .trend-line.down strong {
      color: var(--error);
    }

    .chart-container {
      height: 260px;
    }

    .chart-empty {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      border: 1px dashed var(--border);
      border-radius: 4px;
    }

    .todo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .todo-item {
      padding: 16px;
      background: #F6F6F6;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .todo-title {
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .todo-value {
      color: var(--text);
      font-size: 24px;
      font-weight: 500;
      line-height: 32px;
      font-variant-numeric: tabular-nums;
    }

    .table-panel {
      flex: 0 0 auto;
      min-height: 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .toolbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      box-sizing: border-box;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 32px;
      flex: 0 0 auto;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .table-body {
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      background: #fff;
    }

    .table-pagination {
      min-height: 64px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 0;
      box-sizing: border-box;
      background: #fff;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--text-tertiary);
    }

    .status-dot.warning::before { background: var(--warning); }
    .status-dot.success::before { background: var(--success); }
    .status-dot.error::before { background: var(--error); }
    .status-dot.processing::before { background: var(--processing); }

    .ant-table-wrapper .ant-table-thead > tr > th {
      font-weight: 500;
      background: #FAFAFA;
    }

    .ant-table-wrapper .ant-table-tbody > tr > td {
      font-weight: 400;
    }

    .ant-table-wrapper .ant-table-thead > tr > th.operation-column,
    .ant-table-wrapper .ant-table-tbody > tr > td.operation-column {
      text-align: left;
    }

    .operation-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-start;
    }

    .operation-buttons .ant-btn-link {
      padding-left: 0;
      padding-right: 0;
      height: auto;
      line-height: 22px;
    }

    .operation-buttons .primary-action.ant-btn-link {
      color: var(--primary);
      font-weight: 400;
    }

    .table-statistics {
      padding: 16px 0 0;
    }

    .amount-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .column-setting-button {
      background: #FAFAFA !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .column-setting-button:hover,
    .column-setting-button:focus {
      background: #FAFAFA !important;
      border-color: transparent !important;
      color: var(--primary) !important;
    }

    .column-setting-panel {
      width: 176px;
      padding: 12px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
    }

    .column-setting-title {
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 500;
    }

    .drawer-title-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .drawer-title-text {
      font-weight: 500;
      color: var(--text);
    }

    .drawer-title-close {
      color: var(--text-secondary);
      border: 0;
      box-shadow: none;
    }

    .drawer-section {
      margin-bottom: 24px;
    }

    .drawer-section-title {
      margin-bottom: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .audit-modal .ant-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--divider);
      padding: 12px 24px;
      margin-top: 0;
    }

    .audit-modal .ant-modal-header {
      border-bottom: 1px solid var(--divider);
      padding: 16px 24px;
      margin-bottom: 0;
    }

    .audit-modal .ant-modal-body {
      padding: 24px;
    }

    .audit-modal .ant-modal-content {
      padding: 0;
      overflow: hidden;
    }

    .page-footer {
      height: 24px;
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #A8ABB2;
      background: var(--page-bg);
      font-size: 12px;
      line-height: 20px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>
  <script src="./vendor/g2plot.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <script type="text/babel">
    const {
      App,
      Button,
      Checkbox,
      ConfigProvider,
      DatePicker,
      Descriptions,
      Drawer,
      Dropdown,
      Empty,
      Form,
      Input,
      InputNumber,
      Menu,
      Modal,
      Pagination,
      Select,
      Space,
      Statistic,
      Table,
      Tabs,
      Tag,
      Tooltip,
      message,
    } = antd;

    const AntIcons = window.icons || window.antdIcons || window.AntDesignIcons || {};
    const {
      BarChartOutlined,
      CloseOutlined,
      DatabaseOutlined,
      DownOutlined,
      HomeOutlined,
      MenuFoldOutlined,
      MenuUnfoldOutlined,
      ReloadOutlined,
      SettingOutlined,
      ShopOutlined,
      TeamOutlined,
      UpOutlined,
    } = AntIcons;

    dayjs.locale('zh-cn');
    const { RangePicker } = DatePicker;
    const { TextArea } = Input;

    const PAGE_CONFIG = {
      dashboard: { primary: 'overview', title: '经营大盘首页' },
      guest: { primary: 'overview', title: '房客经营分析' },
      orders: { primary: 'order', title: '全部订单列表' },
      checkin: { primary: 'order', title: '前台入住工作台' },
      rooms: { primary: 'manage', title: '门店房型管理' },
      ota: { primary: 'manage', title: 'OTA 分销渠道管理' },
    };

    const PRIMARY_ITEMS = [
      { key: 'overview', label: '经营数据总览', defaultPage: 'dashboard' },
      { key: 'order', label: '客房订单管理', defaultPage: 'orders' },
      { key: 'manage', label: '门店渠道与房型管理', defaultPage: 'rooms' },
    ];

    const MENU_GROUPS = {
      overview: {
        openKeys: ['overview'],
        items: [{
          key: 'overview',
          icon: <BarChartOutlined />,
          label: '经营数据总览',
          children: [
            { key: 'dashboard', label: '经营大盘首页' },
            { key: 'guest', label: '房客经营分析' },
          ],
        }],
      },
      order: {
        openKeys: ['order'],
        items: [{
          key: 'order',
          icon: <DatabaseOutlined />,
          label: '客房订单管理',
          children: [
            { key: 'orders', label: '全部订单列表' },
            { key: 'checkin', label: '前台入住工作台' },
          ],
        }],
      },
      manage: {
        openKeys: ['manage'],
        items: [{
          key: 'manage',
          icon: <ShopOutlined />,
          label: '门店渠道与房型管理',
          children: [
            { key: 'rooms', label: '门店房型管理' },
            { key: 'ota', label: 'OTA 分销渠道管理' },
          ],
        }],
      },

    function BossChart({ type, data, angleField, colorField, xField, yField, seriesField }) {
      const ref = React.useRef(null);

      React.useEffect(() => {
        if (!ref.current || !window.G2Plot) return undefined;
        ref.current.innerHTML = '';
        let plot;
        const common = {
          data,
          autoFit: true,
          appendPadding: 8,
          theme: { styleSheet: { brandColor: '#F36046', paletteQualitative10: ['#F36046', '#1677FF', '#52C41A', '#FAAD14', '#86909C'] } },
        };
        if (type === 'line') {
          plot = new G2Plot.Line(ref.current, {
            ...common,
            xField,
            yField,
            seriesField,
            smooth: true,
            point: { size: 3 },
            legend: { position: 'bottom' },
          });
        }
        if (type === 'column') {
          plot = new G2Plot.Column(ref.current, {
            ...common,
            xField,
            yField,
            color: '#F36046',
            label: { position: 'top' },
          });
        }
        if (type === 'pie') {
          plot = new G2Plot.Pie(ref.current, {
            ...common,
            angleField,
            colorField,
            radius: 0.82,
            innerRadius: 0.56,
            legend: { position: 'right' },
            statistic: { title: false, content: false },
          });
        }
        plot && plot.render();
        return () => plot && plot.destroy();
      }, [type, JSON.stringify(data)]);

      return <div className="chart-container" ref={ref}><div className="chart-empty">图表加载中</div></div>;
    }

        { title: '异常类型', dataIndex: 'type', key: 'type', width: 120, render: (_, record) => <StatusDot status={record.status} text={record.type} /> },
        { title: '订单编号', dataIndex: 'orderNo', key: 'orderNo', width: 150 },
        { title: '客人', dataIndex: 'guest', key: 'guest', width: 100 },
        { title: '操作', key: 'actions', width: 80, className: 'operation-column', render: (_, record) => <Button className="primary-action" type="link" onClick={() => openDrawer(`${record.type} ${record.orderNo}`)}>查看</Button> },
      ];
      return (
        <>
          <section className="module-panel" style={{ marginTop: 0, borderRadius: '0 8px 8px 8px' }}>
            <div className="toolbar" style={{ paddingTop: 0 }}>
              <div className="toolbar-title">前台入住办理</div>
              <Button type="primary" onClick={() => message.success('导出任务已创建')}>导出每日入住流水</Button>
            </div>
            <Form layout="inline" colon>
              <Space size={8} wrap>
                <Select value={mode} onChange={setMode} style={{ width: 150 }} placeholder="请选择办理方式" options={[{ label: '身份证扫码', value: 'id' }, { label: '手机号查询', value: 'phone' }, { label: '订单号检索', value: 'order' }]} />
                <Input style={{ width: 320 }} value={mode === 'id' ? '3301**********1234' : ''} placeholder="请输入检索信息" />
                <Button type="primary" onClick={() => message.success('查询完成')}>查 询</Button>
                <Button onClick={() => message.success('筛选条件已重置')}>重 置</Button>
                <Button type="primary" onClick={() => Modal.confirm({ title: '确认办理入住？', content: '确认后将写入实时入住流水台账。', okText: '确 认', cancelText: '取 消', onOk: () => message.success('入住办理成功') })}>办理入住</Button>
              </Space>
            </Form>
            <Descriptions style={{ marginTop: 16 }} column={3} size="small">
              <Descriptions.Item label="识别结果">林澈，景观亲子套房，待入住</Descriptions.Item>
              <Descriptions.Item label="预约时间">2026-07-09 15:00 至 2026-07-10 12:00</Descriptions.Item>
              <Descriptions.Item label="押金状态">已冻结 500.00 元</Descriptions.Item>
            </Descriptions>
          </section>
          <MetricGrid columns={3} items={[
            { title: '今日办理入住数(单)', value: 126 },
            { title: '今日房费总收入(元)', value: 84920 },
            { title: '待入住预约订单数量(单)', value: 72 },
          ]} variant="overview" />
          <div className="section-grid equal">
            <section className="table-panel">
              <div className="toolbar"><div className="toolbar-title">实时入住流水台账</div></div>
              <Table rowKey="key" columns={ledgerColumns} dataSource={checkinRows} pagination={false} />
            </section>
            <section className="table-panel">
              <div className="toolbar"><div className="toolbar-title">异常订单台账</div></div>
              <Table rowKey="key" columns={abnormalColumns} dataSource={abnormalRows} pagination={false} />
            </section>
          </div>
        </>
      );
    }

    function RoomsPage({ openDrawer }) {
      const [form] = Form.useForm();
      const [loading, setLoading] = React.useState(false);
      const queryFields = [
        { key: 'status', node: <Form.Item label="门店营业状态" name="status"><Select placeholder="请选择门店营业状态" options={[{ label: '全部状态', value: 'all' }, { label: '营业中', value: 'open' }, { label: '装修暂停', value: 'pause' }]} /></Form.Item> },
        { key: 'floor', node: <Form.Item label="楼层" name="floor"><Select placeholder="请选择楼层" options={[{ label: '全部楼层', value: 'all' }, { label: '1F', value: '1' }, { label: '2F', value: '2' }, { label: '3F', value: '3' }]} /></Form.Item> },
      ];
      const columns = [
        { title: '房型名称', dataIndex: 'name', key: 'name', width: 160, render: (text, record) => <Button className="primary-action" type="link" onClick={() => openDrawer(`${text}经营数据`)}>{text}</Button> },
        { title: '房价(元)', dataIndex: 'price', key: 'price', width: 120, className: 'amount-cell', render: (value) => value.toFixed(2) },
        { title: '房间库存', dataIndex: 'inventory', key: 'inventory', width: 100 },
        { title: '配套设施', dataIndex: 'facilities', key: 'facilities', width: 180, render: (items) => <Space size={4}>{items.map((item) => <Tag key={item}>{item}</Tag>)}</Space> },
        { title: '售卖状态', dataIndex: 'saleText', key: 'saleStatus', width: 100, render: (_, record) => <StatusDot status={record.saleStatus} text={record.saleText} /> },
        { title: '所属门店', dataIndex: 'store', key: 'store', width: 160 },
        { title: '操作', key: 'actions', width: 240, fixed: 'right', className: 'operation-column', render: () => <div className="operation-buttons"><Button className="primary-action" type="link">修改房价</Button><Button type="link">上下架</Button><Button type="link">查看数据</Button></div> },
      ];
      return (
        <>
          <QueryPanel fields={queryFields} form={form} loading={loading} onQuery={() => { setLoading(true); setTimeout(() => { setLoading(false); message.success('查询完成'); }, 500); }} />
          <MetricGrid columns={3} items={[
            { title: '门店总数量(家)', value: 32 },
            { title: '营业中门店(家)', value: 29 },
            { title: '装修暂停门店(家)', value: 3 },
          ]} variant="overview" />
          <section className="table-panel">
            <div className="toolbar">
              <div className="toolbar-title">房型列表</div>
              <div className="toolbar-actions"><Button type="primary">新增门店</Button><Button type="primary">新增房型</Button><ColumnSetting options={columns.filter((column) => column.key !== 'actions').map((column) => ({ label: column.title, value: column.key }))} value={columns.filter((column) => column.key !== 'actions').map((column) => column.key)} onChange={() => {}} /></div>
            </div>
            <Table rowKey="key" columns={columns} dataSource={roomRows} pagination={false} scroll={{ x: 1160 }} />
            <div className="table-pagination"><Pagination current={1} pageSize={10} total={86} showTotal={(total) => `共 ${total} 条`} locale={{ items_per_page: '条/页', jump_to: '跳至', jump_to_confirm: '确定', page: '页' }} /></div>
          </section>
        </>
      );
    }

    function OtaPage({ openDrawer }) {
      const [form] = Form.useForm();
      const [loading, setLoading] = React.useState(false);
      const channelData = [
        { type: '携程', value: 36 },
        { type: '美团', value: 25 },
        { type: '飞猪', value: 19 },
        { type: '同程', value: 12 },
        { type: '其他', value: 8 },
      ];
      const columns = [
        { title: '渠道名称', dataIndex: 'name', key: 'name', width: 140 },
        { title: '扣点比例', dataIndex: 'rate', key: 'rate', width: 100 },
        { title: '累计销售额(元)', dataIndex: 'sales', key: 'sales', width: 150, className: 'amount-cell', render: (value) => value.toFixed(2) },
        { title: '待结算佣金(元)', dataIndex: 'commission', key: 'commission', width: 160, className: 'amount-cell', render: (value) => value.toFixed(2) },
        { title: '合作状态', dataIndex: 'statusText', key: 'status', width: 110, render: (_, record) => <StatusDot status={record.status} text={record.statusText} /> },
        { title: '操作', key: 'actions', width: 260, fixed: 'right', className: 'operation-column', render: () => <div className="operation-buttons"><Button className="primary-action" type="link">修改扣点</Button><Button type="link">房型上下架</Button><Button type="link" onClick={() => Modal.confirm({ title: '确认发起渠道对账结算？', content: '结算会生成渠道财务单据，请确认是否继续。', okText: '确 认', cancelText: '取 消', onOk: () => message.success('对账结算已发起') })}>对账结算</Button></div> },
      ];
      return (
        <>
          <QueryPanel fields={[{ key: 'status', node: <Form.Item label="渠道合作状态" name="status"><Select placeholder="请选择渠道合作状态" options={[{ label: '全部状态', value: 'all' }, { label: '合作中', value: 'open' }, { label: '暂停合作', value: 'pause' }]} /></Form.Item> }]} form={form} loading={loading} onQuery={() => { setLoading(true); setTimeout(() => { setLoading(false); message.success('查询完成'); }, 500); }} />
          <MetricGrid items={[
            { title: '合作渠道总数(个)', value: 12 },
            { title: '渠道总营收(元)', value: 1946220 },
            { title: '待结算佣金(元)', value: 184650 },
            { title: '渠道平均扣点比例(%)', value: 11.8, precision: 1 },
          ]} variant="overview" />
          <section className="module-panel">
            <div className="module-title">各 OTA 渠道营收占比</div>
            <BossChart type="pie" data={channelData} angleField="value" colorField="type" />
          </section>
          <section className="table-panel">
            <div className="toolbar"><div className="toolbar-title">渠道列表</div><div className="toolbar-actions"><Button type="primary">新增 OTA 渠道</Button><ColumnSetting options={columns.filter((column) => column.key !== 'actions').map((column) => ({ label: column.title, value: column.key }))} value={columns.filter((column) => column.key !== 'actions').map((column) => column.key)} onChange={() => {}} /></div></div>
            <Table rowKey="key" columns={columns} dataSource={channelRows} pagination={false} scroll={{ x: 1160 }} />
            <div className="table-pagination"><Pagination current={1} pageSize={10} total={12} showTotal={(total) => `共 ${total} 条`} locale={{ items_per_page: '条/页', jump_to: '跳至', jump_to_confirm: '确定', page: '页' }} /></div>
          </section>
        </>
      );
    }

    function HotelHomestayOpsPage() {
      const [collapsed, setCollapsed] = React.useState(false);
      const [activePage, setActivePage] = React.useState('dashboard');
      const [openKeys, setOpenKeys] = React.useState(['overview']);
      const [tabs, setTabs] = React.useState(['dashboard']);
      const [drawerOpen, setDrawerOpen] = React.useState(false);
      const [drawerTitle, setDrawerTitle] = React.useState('详情');
      const activePrimary = PAGE_CONFIG[activePage].primary;

      const activatePage = (pageKey) => {
        setActivePage(pageKey);
        setOpenKeys(MENU_GROUPS[PAGE_CONFIG[pageKey].primary].openKeys);
        setTabs((prev) => prev.includes(pageKey) ? prev : [...prev, pageKey]);
      };

      const openDrawer = (title) => {
        setDrawerTitle(title);
        setDrawerOpen(true);
      };

      const removeTab = (targetKey) => {
        if (tabs.length === 1) return;
        const nextTabs = tabs.filter((key) => key !== targetKey);
        setTabs(nextTabs);
        if (activePage === targetKey) activatePage(nextTabs[nextTabs.length - 1]);
      };

      const tabItems = tabs.map((key) => ({
        key,
        closable: tabs.length > 1,
        label: (
          <Tooltip title={PAGE_CONFIG[key].title.length > 6 ? PAGE_CONFIG[key].title : ''}>
            <span className="tab-label">
              {activePage === key && <ReloadOutlined />}
              <span className="tab-title">{PAGE_CONFIG[key].title}</span>
            </span>
          </Tooltip>
        ),
      }));

      return (
        <div className="boss-page">
          <div className="topbar">
            <div>上次登录时间：2026-07-09 09:18:32　登录 IP：10.24.18.66　当前身份：酒店运营主管</div>
            <div>10080090899 · Boss Ledger 商户后台　帮助中心　消息</div>
          </div>
          <header className="primary-nav">
            <div className="logo-zone"><img className="logo" src="./assets/boss-ledger-logo.svg" alt="老板管账" /></div>
            <nav className="primary-items">
              {PRIMARY_ITEMS.map((item) => (
                <div key={item.key} className={`primary-item ${activePrimary === item.key ? 'active' : ''}`} onClick={() => activatePage(item.defaultPage)}>{item.label}</div>
              ))}
            </nav>
          </header>
          <div className="shell">
            <aside className={`sider ${collapsed ? 'collapsed' : ''}`}>
              <div className="sider-menu">
                <Menu
                  mode="inline"
                  inlineCollapsed={collapsed}
                  inlineCollapsedWidth={48}
                  selectedKeys={[activePage]}
                  openKeys={collapsed ? [] : openKeys}
                  onOpenChange={setOpenKeys}
                  onClick={({ key }) => activatePage(key)}
                  items={MENU_GROUPS[activePrimary].items}
                />
              </div>
              <div className="collapse-control" onClick={() => setCollapsed(!collapsed)}>
                {collapsed ? <MenuUnfoldOutlined /> : <MenuFoldOutlined />}
              </div>
            </aside>
            <main className="workspace">
              <div className="work-body">
                <div className="tab-strip">
                  <Tabs
                    className="boss-tabs"
                    type="editable-card"
                    hideAdd
                    activeKey={activePage}
                    onChange={activatePage}
                    onEdit={(targetKey, action) => action === 'remove' && removeTab(targetKey)}
                    items={tabItems}
                  />
                </div>
                <section className="content">
                  {activePage === 'dashboard' && <DashboardPage openDrawer={openDrawer} />}
                  {activePage === 'guest' && <GuestPage />}
                  {activePage === 'orders' && <OrdersPage openDrawer={openDrawer} />}
                  {activePage === 'checkin' && <CheckinPage openDrawer={openDrawer} />}
                  {activePage === 'rooms' && <RoomsPage openDrawer={openDrawer} />}
                  {activePage === 'ota' && <OtaPage openDrawer={openDrawer} />}
                  <footer className="page-footer">© 2026 易宝支付有限公司 版权所有</footer>
                </section>
              </div>
            </main>
          </div>
          <Drawer
            title={(
              <div className="drawer-title-bar">
                <span className="drawer-title-text">{drawerTitle}</span>
                <Button className="drawer-title-close" type="text" icon={<CloseOutlined />} onClick={() => setDrawerOpen(false)} />
              </div>
            )}
            width={720}
            open={drawerOpen}
            onClose={() => setDrawerOpen(false)}
            closable={false}
            footer={<Space style={{ display: 'flex', justifyContent: 'flex-end' }}><Button onClick={() => setDrawerOpen(false)}>取 消</Button><Button type="primary" onClick={() => setDrawerOpen(false)}>确 认</Button></Space>}
          >
            <div className="drawer-section">
              <div className="drawer-section-title">基础信息</div>
              <Descriptions column={3} size="small">
                <Descriptions.Item label="业务编号">BL-HOTEL-20260709</Descriptions.Item>
                <Descriptions.Item label="所属门店">杭州西湖湖滨店</Descriptions.Item>
                <Descriptions.Item label="当前状态"><StatusDot status="processing" text="处理中" /></Descriptions.Item>
                <Descriptions.Item label="业务摘要" span={3}>该抽屉用于承载订单详情、房型经营数据、待办详情或异常订单信息。</Descriptions.Item>
              </Descriptions>
            </div>
            <div className="drawer-section">
              <div className="drawer-section-title">处理记录</div>
              <Descriptions column={1} size="small">
                <Descriptions.Item label="最近操作">2026-07-09 10:42 酒店运营主管更新</Descriptions.Item>
                <Descriptions.Item label="后续动作">可在正式系统中接入审核、结算、退款、续住或客诉处理流程。</Descriptions.Item>
              </Descriptions>
            </div>
          </Drawer>
        </div>
      );
    }

    function Root() {
      return (
        <ConfigProvider
          locale={(antd.locales && antd.locales.zh_CN) || (antd.locale && antd.locale.zh_CN)}
          theme={{
            cssVar: true,
            token: {
              colorPrimary: '#F36046',
              colorLink: '#F36046',
              colorInfo: '#F36046',
              lineWidth: 1,
              controlHeight: 32,
              borderRadius: 4,
            },
          }}
        >
          <App>
            <HotelHomestayOpsPage />
          </App>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
