<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOP API 首页</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #1769ff;
      --primary-hover: #3f86ff;
      --primary-soft: #eef5ff;
      --page-bg: #f6f8fb;
      --panel-bg: #ffffff;
      --border: #e7ebf0;
      --text: #111827;
      --text-secondary: #4b5563;
      --text-tertiary: #8a94a6;
      --code-bg: #f4f7fb;
    }

    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .yop-page {
      min-width: 1180px;
      background: var(--page-bg);
    }

    .top-nav {
      height: 64px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #58a6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 18px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 600;
    }

    .brand-subtitle {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .nav-links {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: 48px;
      flex: 1;
    }

    .nav-link {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
    }

    .nav-link.active {
      color: var(--primary);
      font-weight: 500;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .layout {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr) 188px;
      gap: 24px;
      width: min(1440px, calc(100vw - 64px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .left-nav,
    .right-anchor {
      position: sticky;
      top: 88px;
      align-self: start;
    }

    .doc-tree,
    .anchor-panel,
    .section {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .doc-tree {
      padding: 8px;
    }

    .doc-tree-title {
      padding: 10px 12px;
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .main {
      min-width: 0;
    }

    .hero {
      min-height: 256px;
      border-radius: 8px;
      padding: 34px 40px;
      background:
        linear-gradient(120deg, rgba(23, 105, 255, 0.12), rgba(255, 255, 255, 0) 58%),
        #fff;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -110px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 44px solid rgba(23, 105, 255, 0.08);
    }

    .hero-content {
      width: 68%;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--primary);
      font-weight: 500;
    }

    .hero h1 {
      margin: 0;
      font-size: 34px;
      line-height: 44px;
      letter-spacing: 0;
    }

    .hero-desc {
      margin: 14px 0 24px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 26px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-panel {
      margin-top: 16px;
      padding: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .hot-keywords {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-tertiary);
    }

    .section {
      margin-top: 16px;
      padding: 24px;
    }

    .section-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
    }

    .section-desc {
      margin-top: 6px;
      color: var(--text-tertiary);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .category-card {
      min-height: 118px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .category-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(23, 105, 255, 0.10);
      transform: translateY(-1px);
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .category-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .category-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .category-desc {
      margin-top: 12px;
      color: var(--text-secondary);
      min-height: 44px;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .resource-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 96px;
    }

    .resource-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .resource-title {
      font-weight: 600;
    }

    .resource-desc {
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    .update-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .update-item {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .update-item:last-child {
      border-bottom: 0;
    }

    .update-date {
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .code {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--code-bg);
      color: #1f2937;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    .anchor-panel {
      padding: 14px;
    }

    .help-panel {
      margin-top: 12px;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .help-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .help-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .yop-footer {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      border-top: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <script type="text/babel">
    const {
      Anchor,
      App,
      Badge,
      Button,
      ConfigProvider,
      Empty,
      Input,
      Menu,
      Segmented,
      Space,
      Steps,
      Table,
      Tag,
      Tooltip,
      message,
    } = antd;

    const AntIcons = window.icons || window.antdIcons || window.AntDesignIcons || {};
    const {
      ApiOutlined,
      AppstoreOutlined,
      BookOutlined,
      CodeOutlined,
      ConsoleSqlOutlined,
      CreditCardOutlined,
      DeploymentUnitOutlined,
      FileSearchOutlined,
      GithubOutlined,
      GlobalOutlined,
      KeyOutlined,
      LinkOutlined,
      NotificationOutlined,
      QuestionCircleOutlined,
      SearchOutlined,
      SafetyCertificateOutlined,
      SwapOutlined,
      ToolOutlined,
    } = AntIcons;

    const categories = [
      { name: '支付', count: 18, icon: <CreditCardOutlined />, desc: '下单、支付结果、支付查询、支付关闭等核心交易接口。' },
      { name: '退款', count: 9, icon: <SwapOutlined />, desc: '退款申请、退款查询、退款通知和差错处理接口。' },
      { name: '分账', count: 12, icon: <DeploymentUnitOutlined />, desc: '分账规则、分账执行、分账结果和分账退回能力。' },
      { name: '商户进件', count: 15, icon: <AppstoreOutlined />, desc: '商户开户注册、资质上传、状态查询和资料变更。' },
      { name: '账户', count: 8, icon: <KeyOutlined />, desc: '账户余额、账户信息、资金明细和权限相关能力。' },
      { name: '对账', count: 6, icon: <FileSearchOutlined />, desc: '交易账单、结算账单、下载任务和对账文件。' },
      { name: '通知回调', count: 7, icon: <NotificationOutlined />, desc: '异步通知、回调验签、通知重发和订阅配置。' },
      { name: '风控', count: 5, icon: <SafetyCertificateOutlined />, desc: '风险校验、名单校验、交易限额和异常识别。' },
    ];

    const apiRows = [
      {
        key: 'pay-create',
        apiName: '统一支付下单 API',
        apiCode: 'yop.pay.order.create',
        category: '支付',
        description: '创建一笔支付订单，支持多支付方式统一接入。',
        status: 'available',
        version: 'v1.0',
        updatedAt: '2026-07-08',
      },
      {
        key: 'refund-apply',
        apiName: '退款申请 API',
        apiCode: 'yop.refund.apply',
        category: '退款',
        description: '发起订单退款，支持全额和部分退款。',
        status: 'available',
        version: 'v1.2',
        updatedAt: '2026-07-03',
      },
      {
        key: 'split-execute',
        apiName: '分账执行 API',
        apiCode: 'yop.split.execute',
        category: '分账',
        description: '按规则执行交易分账，并返回分账处理结果。',
        status: 'beta',
        version: 'v0.9',
        updatedAt: '2026-06-28',
      },
      {
        key: 'merchant-register',
        apiName: '商户进件 API',
        apiCode: 'yop.merchant.register',
        category: '商户进件',
        description: '提交商户开户注册资料，支持资料补传和状态查询。',
        status: 'available',
        version: 'v1.1',
        updatedAt: '2026-06-20',
      },
      {
        key: 'legacy-pay',
        apiName: '旧版收银台 API',
        apiCode: 'yop.cashier.legacy',
        category: '支付',
        description: '旧版收银台接入方式，建议迁移到统一支付下单 API。',
        status: 'deprecated',
        version: 'v0.8',
        updatedAt: '2026-05-12',
      },
    ];

    const updates = [
      { date: '2026-07-08', tag: '更新', type: 'processing', text: '统一支付下单 API 新增 buyerInfo 扩展字段说明。' },
      { date: '2026-07-03', tag: '公告', type: 'warning', text: '旧版收银台 API 将于 2026-10-01 停止新商户接入。' },
      { date: '2026-06-28', tag: 'Beta', type: 'processing', text: '分账执行 API 开放沙箱环境联调。' },
      { date: '2026-06-20', tag: '新增', type: 'success', text: '商户进件 API 增加资料补传示例代码。' },
    ];

    const resources = [
      { title: 'SDK 下载', icon: <GithubOutlined />, desc: 'Java、Node.js、PHP、Go SDK 与版本说明。' },
      { title: '示例代码', icon: <CodeOutlined />, desc: '支付、退款、回调验签和分账示例。' },
      { title: '错误码', icon: <QuestionCircleOutlined />, desc: '接口错误码、原因说明和处理建议。' },
      { title: '签名说明', icon: <KeyOutlined />, desc: '请求签名、验签流程和密钥管理说明。' },
      { title: '回调说明', icon: <LinkOutlined />, desc: '通知格式、重发机制和验签规则。' },
      { title: 'FAQ', icon: <BookOutlined />, desc: '接入常见问题、排查路径和最佳实践。' },
    ];

    const statusMap = {
      available: { label: '可用', color: 'success' },
      beta: { label: 'Beta', color: 'processing' },
      deprecated: { label: '即将下线', color: 'warning' },
      offline: { label: '已下线', color: 'default' },
      maintenance: { label: '维护中', color: 'warning' },
    };

    function StatusTag({ value }) {
      const status = statusMap[value] || statusMap.available;
      return <Tag color={status.color}>{status.label}</Tag>;
    }

    function YopApiHome() {
      const [keyword, setKeyword] = React.useState('');
      const [environment, setEnvironment] = React.useState('全部');
      const [filteredRows, setFilteredRows] = React.useState(apiRows);

      const doSearch = (value) => {
        const nextKeyword = (value || '').trim();
        setKeyword(nextKeyword);
        if (!nextKeyword) {
          setFilteredRows(apiRows);
          message.success('已展示全部推荐 API');
          return;
        }
        const result = apiRows.filter((item) =>
          [item.apiName, item.apiCode, item.category, item.description].some((field) => field.includes(nextKeyword))
        );
        setFilteredRows(result);
        if (result.length) {
          message.success(`找到 ${result.length} 条相关 API`);
        } else {
          message.warning('未找到相关 API 或文档');
        }
      };

      const columns = [
        {
          title: 'API 名称',
          dataIndex: 'apiName',
          key: 'apiName',
          width: 190,
          render: (text) => <Button type="link" style={{ padding: 0 }}>{text}</Button>,
        },
        {
          title: 'API 标识',
          dataIndex: 'apiCode',
          key: 'apiCode',
          width: 210,
          render: (text) => <span className="code">{text}</span>,
        },
        { title: '分类', dataIndex: 'category', key: 'category', width: 92 },
        { title: '描述', dataIndex: 'description', key: 'description', ellipsis: true },
        {
          title: '状态',
          dataIndex: 'status',
          key: 'status',
          width: 104,
          render: (value) => <StatusTag value={value} />,
        },
        { title: '版本', dataIndex: 'version', key: 'version', width: 82 },
        { title: '更新时间', dataIndex: 'updatedAt', key: 'updatedAt', width: 118 },
        {
          title: '操作',
          key: 'actions',
          width: 190,
          render: (_, record) => (
            <Space size={8}>
              <Button type="link" style={{ padding: 0 }}>查看文档</Button>
              {record.status === 'deprecated' ? (
                <Button type="link" style={{ padding: 0 }}>迁移说明</Button>
              ) : (
                <Button type="link" style={{ padding: 0 }}>调试接口</Button>
              )}
            </Space>
          ),
        },
      ];

      const menuItems = [
        { key: 'overview', icon: <GlobalOutlined />, label: 'API 首页' },
        { key: 'api', icon: <ApiOutlined />, label: 'API 文档' },
        { key: 'guide', icon: <BookOutlined />, label: '接入指南' },
        { key: 'sdk', icon: <CodeOutlined />, label: 'SDK 与示例' },
        { key: 'error', icon: <QuestionCircleOutlined />, label: '错误码' },
        { key: 'changelog', icon: <NotificationOutlined />, label: '更新日志' },
      ];

      const anchorItems = [
        { key: 'search', href: '#search', title: '搜索 API' },
        { key: 'categories', href: '#categories', title: 'API 分类' },
        { key: 'featured', href: '#featured', title: '推荐 API' },
        { key: 'onboarding', href: '#onboarding', title: '接入流程' },
        { key: 'resources', href: '#resources', title: '开发资源' },
        { key: 'updates', href: '#updates', title: '更新公告' },
      ];

      return (
        <div className="yop-page">
          <header className="top-nav">
            <div className="brand">
              <div className="brand-mark">Y</div>
              <div className="brand-text">
                <div className="brand-name">YOP 开放平台</div>
                <div className="brand-subtitle">API 文档中心</div>
              </div>
            </div>
            <nav className="nav-links">
              <div className="nav-link">产品文档</div>
              <div className="nav-link active">API 文档</div>
              <div className="nav-link">开发者中心</div>
              <div className="nav-link">接入指南</div>
              <div className="nav-link">帮助中心</div>
            </nav>
            <div className="nav-actions">
              <Button>登录</Button>
              <Button type="primary">进入控制台</Button>
            </div>
          </header>

          <div className="layout">
            <aside className="left-nav">
              <div className="doc-tree">
                <div className="doc-tree-title">文档目录</div>
                <Menu selectedKeys={['overview']} mode="inline" items={menuItems} />
              </div>
            </aside>

            <main className="main">
              <section className="hero">
                <div className="hero-content">
                  <div className="eyebrow">YOP API Center</div>
                  <h1>面向开发者的一站式 API 接入入口</h1>
                  <div className="hero-desc">
                    查找支付、退款、分账、商户进件等开放能力，获取接入指南、SDK、错误码和示例代码，快速完成沙箱联调与生产上线。
                  </div>
                  <div className="hero-actions">
                    <Button type="primary" size="large">开始接入</Button>
                    <Button size="large">查看全部 API</Button>
                  </div>
                </div>
              </section>

              <section id="search" className="search-panel">
                <Input.Search
                  size="large"
                  allowClear
                  value={keyword}
                  prefix={<SearchOutlined />}
                  placeholder="搜索 API 名称、接口标识、错误码、SDK 或文档标题"
                  enterButton="搜索"
                  onChange={(event) => setKeyword(event.target.value)}
                  onSearch={doSearch}
                />
                <div className="hot-keywords">
                  <span>热门搜索：</span>
                  {['统一支付', '退款申请', '回调验签', '错误码', 'Java SDK'].map((item) => (
                    <Tag key={item} onClick={() => doSearch(item)} style={{ cursor: 'pointer' }}>{item}</Tag>
                  ))}
                </div>
              </section>

              <section id="categories" className="section">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">API 分类</h2>
                    <div className="section-desc">按业务能力浏览开放接口，快速进入目标文档集合。</div>
                  </div>
                  <Button type="link">查看全部分类</Button>
                </div>
                <div className="category-grid">
                  {categories.map((item) => (
                    <div className="category-card" key={item.name}>
                      <div className="category-head">
                        <div className="category-name">
                          <span className="category-icon">{item.icon}</span>
                          {item.name}
                        </div>
                        <Badge count={item.count} color="#1769ff" />
                      </div>
                      <div className="category-desc">{item.desc}</div>
                    </div>
                  ))}
                </div>
              </section>

              <section id="featured" className="section">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">推荐 / 高频 API</h2>
                    <div className="section-desc">优先展示最常用的接入能力，支持文档查看、调试和申请接入。</div>
                  </div>
                  <Segmented
                    value={environment}
                    onChange={setEnvironment}
                    options={['全部', '沙箱', '生产']}
                  />
                </div>
                <Table
                  rowKey="key"
                  columns={columns}
                  dataSource={filteredRows}
                  pagination={false}
                  locale={{ emptyText: <Empty description="未找到相关 API 或文档" /> }}
                />
              </section>

              <section id="onboarding" className="section">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">接入流程</h2>
                    <div className="section-desc">按步骤完成应用创建、密钥配置、沙箱联调和生产上线。</div>
                  </div>
                  <Button type="link">查看接入指南</Button>
                </div>
                <Steps
                  current={1}
                  items={[
                    { title: '创建应用', description: '完成开发者认证并创建应用' },
                    { title: '获取密钥', description: '配置应用公钥与回调地址' },
                    { title: '沙箱联调', description: '使用测试参数完成接口调试' },

                    { title: '上线发布', description: '切换生产环境正式接入' },

              <section id="resources" className="section">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">开发资源</h2>
                    <div className="section-desc">集中查看 SDK、示例代码、签名、回调和排查资料。</div>
                  </div>
                </div>
                <div className="resource-grid">
                  {resources.map((item) => (
                    <div className="resource-card" key={item.title}>
                      <span className="resource-icon">{item.icon}</span>
                      <div>
                        <div className="resource-title">{item.title}</div>
                        <div className="resource-desc">{item.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              <section id="updates" className="section">
                <div className="section-header">
                  <div>
                    <h2 className="section-title">最新更新 / 公告</h2>
                    <div className="section-desc">关注接口字段、版本、下线计划和重要维护通知。</div>
                  </div>
                  <Button type="link">查看更新日志</Button>
                </div>
                <div className="update-list">
                  {updates.map((item) => (
                    <div className="update-item" key={item.date + item.text}>
                      <div className="update-date">{item.date}</div>
                      <div>{item.text}</div>
                      <Tag color={item.type}>{item.tag}</Tag>
                    </div>
                  ))}
                </div>
              </section>
            </main>

            <aside className="right-anchor">
              <div className="anchor-panel">
                <Anchor affix={false} items={anchorItems} />
              </div>
              <div className="help-panel">
                <div className="help-title">需要帮助？</div>
                <div className="help-links">
                  <Button type="link" style={{ padding: 0, justifyContent: 'flex-start' }}>提交文档反馈</Button>
                  <Button type="link" style={{ padding: 0, justifyContent: 'flex-start' }}>联系技术支持</Button>
                  <Button type="link" style={{ padding: 0, justifyContent: 'flex-start' }}>查看常见问题</Button>
                </div>
              </div>
            </aside>
          </div>
          <footer className="yop-footer">© 2026 易宝支付有限公司 版权所有</footer>
        </div>
      );
    }

    function Root() {
      return (
        <ConfigProvider
          locale={(antd.locales && antd.locales.zh_CN) || (antd.locale && antd.locale.zh_CN)}
          theme={{
            cssVar: true,
            token: {
              colorPrimary: '#1769ff',
              colorLink: '#1769ff',
              colorInfo: '#1769ff',
              borderRadius: 6,
              controlHeight: 34,
            },
          }}
        >
          <App>
            <YopApiHome />
          </App>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
