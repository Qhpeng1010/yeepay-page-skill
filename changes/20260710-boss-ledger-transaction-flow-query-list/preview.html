<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Ledger - 交易流水查询列表</title>
  <link rel="stylesheet" href="./vendor/antd-reset.css" />
  <style>
    :root {
      --primary: #F36046;
      --primary-hover: #FF7A66;
      --selected-bg: #FEF2F0;
      --page-bg: #F4F4F4;
      --topbar-bg: #3A3A3A;
      --border: #E5E6EB;
      --divider: #F0F0F0;
      --text: #1F2329;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --topbar-text: #B8B8B8;
      --success: #52C41A;
      --warning: #FAAD14;
      --error: #FF4D4F;
      --processing: #1677FF;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      color: var(--text);
      font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .boss-page {
      min-width: 1120px;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
    }

    .topbar {
      height: 28px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--topbar-text);
      background: var(--topbar-bg);
      font-size: 12px;
      white-space: nowrap;
    }

    .primary-nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 5;
    }

    .logo-zone {
      width: 208px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .logo {
      width: 128px;
      height: 40px;
      display: block;
      object-fit: contain;
    }

    .primary-items {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding-right: 32px;
    }

    .primary-item {
      height: 64px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      position: relative;
      white-space: nowrap;
    }

    .primary-item.active {
      color: var(--primary);
    }

    .primary-item.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
    }

    .shell {
      display: flex;
      height: calc(100vh - 92px);
      overflow: hidden;
    }

    .sider {
      width: 208px;
      flex: 0 0 208px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--divider);
      transition: width .2s ease, flex-basis .2s ease;
    }

    .sider.collapsed {
      width: 48px;
      flex-basis: 48px;
      overflow: hidden;
    }

    .sider-menu {
      flex: 1;
      width: 207px;
      padding-top: 4px;
      overflow: auto;
    }

    .sider-menu .ant-menu {
      border-inline-end: 0 !important;
      font-weight: 400;
      width: 207px !important;
    }

    .sider.collapsed .ant-menu-inline-collapsed {
      width: 48px !important;
    }

    .sider.collapsed .sider-menu,
    .sider.collapsed .sider-menu .ant-menu {
      width: 48px !important;
    }

    .sider.collapsed .ant-menu-submenu-arrow {
      display: none !important;
    }

    .sider-menu .ant-menu-item,
    .sider-menu .ant-menu-submenu-title {
      width: 207px !important;
      height: 40px !important;
      line-height: 40px !important;
      margin: 0 !important;
      border-radius: 0 !important;
      font-weight: 400 !important;
    }

    .sider-menu .ant-menu-item .anticon,
    .sider-menu .ant-menu-submenu-title .anticon {
      margin-inline-end: 8px !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item,
    .sider.collapsed .sider-menu .ant-menu-submenu-title {
      width: 48px !important;
      padding-inline: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
    }

    .sider.collapsed .sider-menu .ant-menu-title-content {
      display: none !important;
    }

    .sider.collapsed .sider-menu .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .ant-menu-item-icon,
    .sider.collapsed .sider-menu .ant-menu-item .anticon,
    .sider.collapsed .sider-menu .ant-menu-submenu-title .anticon {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-inline-end: 0 !important;
      min-width: 0 !important;
      font-size: 16px !important;
    }

    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title,
    .sider-menu .ant-menu-submenu-selected > .ant-menu-submenu-title .anticon {
      color: var(--primary) !important;
    }

    .sider-menu .ant-menu-item-selected {
      color: var(--primary) !important;
      background: var(--selected-bg) !important;
    }

    .sider-menu .ant-menu-item-selected::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--primary);
    }

    .collapse-control {
      height: 48px;
      border-top: 1px solid #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 16px;
      color: var(--text-tertiary);
      cursor: pointer;
    }

    .sider-toggle {
      justify-content: flex-start;
    }

    .sider.collapsed .collapse-control {
      justify-content: flex-start;
      padding-left: 16px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }

    .work-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .tab-strip {
      height: 48px;
      flex: 0 0 auto;
      padding-top: 4px;
      padding-left: 16px;
      background: var(--page-bg);
      box-sizing: border-box;
    }

    .boss-tabs.ant-tabs {
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav {
      margin: 0 !important;
      height: 44px;
    }

    .boss-tabs .ant-tabs-nav::before {
      border-bottom: 0 !important;
    }

    .boss-tabs .ant-tabs-tab {
      height: 44px;
      margin: 0 !important;
      padding: 0 12px !important;
      background: #eee !important;
      border: 0 !important;
      border-radius: 4px 4px 0 0 !important;
      color: var(--text-secondary);
    }

    .boss-tabs .ant-tabs-tab-active {
      background: #fff !important;
      border-radius: 8px 8px 0 0 !important;
    }

    .boss-tabs .ant-tabs-tab-active .ant-tabs-tab-btn {
      color: var(--primary) !important;
    }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 0;
      max-width: 144px;
    }

    .tab-label .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-label .anticon {
      color: #B8B8B8;
      font-size: 14px;
      flex: 0 0 auto;
      margin-inline-end: 8px;
    }

    .boss-tabs .ant-tabs-tab-remove {
      color: #B8B8B8 !important;
      margin-left: 4px !important;
    }

    .boss-tabs .ant-tabs-ink-bar {
      display: none;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 16px 16px;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
    }

    .query-panel {
      background: #fff;
      padding: 16px;
      border-radius: 0 8px 8px 8px;
    }

    .query-panel .ant-form-item {
      margin: 0;
    }

    .ant-form-item-label > label {
      column-gap: 8px;
    }

    .ant-form-horizontal .ant-form-item-label {
      padding-inline-end: 8px;
    }

    .ant-form-vertical .ant-form-item-label {
      padding-bottom: 8px;
    }

    .ant-form-item-label > label::after {
      margin-inline-start: 0 !important;
      margin-inline-end: 0 !important;
    }

    .query-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .query-grid .ant-form-item {
      min-width: 0;
    }

    .query-grid .ant-form-item-row {
      column-gap: 8px;
      flex-wrap: nowrap;
    }

    .query-grid .ant-form-item-label {
      flex: 0 0 auto;
      padding-inline-end: 0;
      margin-right: 0;
    }

    .query-grid .ant-form-item-control {
      flex: 1 1 auto;
      min-width: 0;
    }

    .query-grid .ant-picker,
    .query-grid .ant-select,
    .query-grid .ant-input-affix-wrapper {
      width: 100%;
    }

    .query-actions {
      grid-column: 3 / 4;
      justify-self: end;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      column-gap: 8px;
      min-width: 0;
    }

    .query-toggle {
      padding-left: 0 !important;
      padding-right: 8px !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .table-panel {
      flex: 0 0 auto;
      min-height: 0;
      margin-top: 12px;
      padding: 0 16px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .toolbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      box-sizing: border-box;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 32px;
      flex: 0 0 auto;
    }

    .query-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      padding-top: 16px;
      background: transparent;
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
      background: #F6F6F6;
      border-radius: 4px;
    }

    .summary-card .ant-statistic-title {
      margin-bottom: 4px;
      color: var(--text-tertiary);
      font-size: 14px;
      line-height: 22px;
    }

    .summary-card .ant-statistic-content {
      color: var(--text);
      font-size: 18px;
      line-height: 26px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .table-body {
      flex: 0 0 auto;
      min-width: 0;
      overflow: visible;
      background: #fff;
    }

    .table-panel .ant-table-wrapper {
      min-width: 0;
      min-height: auto;
    }

    .table-pagination {
      min-height: 64px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 0;
      box-sizing: border-box;
      background: #fff;
      max-width: 100%;
      overflow: visible;
    }

    .table-body .ant-table-wrapper + .table-pagination {
      margin-top: 0;
    }

    .table-pagination .ant-pagination {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .table-fill {
      display: none;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--text-tertiary);
    }

    .status-dot.warning::before { background: var(--warning); }
    .status-dot.success::before { background: var(--success); }
    .status-dot.error::before { background: var(--error); }
    .status-dot.processing::before { background: var(--processing); }

    .ant-table-wrapper .ant-table-thead > tr > th {
      font-weight: 500;
      background: #FAFAFA;
    }

    .ant-table-wrapper .ant-table-tbody > tr > td {
      font-weight: 400;
    }

    .ant-table-wrapper .ant-table-thead > tr > th.operation-column,
    .ant-table-wrapper .ant-table-tbody > tr > td.operation-column {
      text-align: left;
    }

    .operation-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-start;
    }

    .operation-buttons .ant-btn-link {
      padding-left: 0;
      padding-right: 0;
      height: auto;
      line-height: 22px;
      color: var(--primary);
      background: transparent !important;
    }

    .operation-buttons .secondary-action {
      padding-left: 0;
      padding-right: 0;
      height: auto;
      line-height: 22px;
      color: var(--primary);
      font-weight: 400;
      background: transparent !important;
    }

    .operation-buttons .ant-btn-link:hover,
    .operation-buttons .ant-btn-link:focus,
    .operation-buttons .secondary-action:hover,
    .operation-buttons .secondary-action:focus {
      color: var(--primary-hover);
      background: transparent !important;
    }

    .amount-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .drawer-section {
      margin-bottom: 24px;
    }

    .drawer-title-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .drawer-title-text {
      font-weight: 500;
      color: var(--text);
    }

    .drawer-title-close {
      color: var(--text-secondary);
      border: 0;
      box-shadow: none;
    }

    .drawer-section-title {
      margin-bottom: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .audit-modal .ant-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--divider);
      padding: 12px 24px;
      margin-top: 0;
    }

    .audit-modal .ant-modal-header {
      border-bottom: 1px solid var(--divider);
      padding: 16px 24px;
      margin-bottom: 0;
    }

    .audit-modal .ant-modal-body {
      padding: 24px;
    }

    .audit-modal .ant-modal-content {
      padding: 0;
      overflow: hidden;
    }

    .audit-modal .ant-form-item {
      margin-bottom: 16px;
    }

    .audit-modal .ant-form-item:last-child {
      margin-bottom: 0;
    }

    .ant-modal .ant-modal-header {
      border-bottom: 1px solid var(--divider);
    }

    .ant-modal .ant-modal-footer {
      border-top: 1px solid var(--divider);
    }

    .ant-modal .ant-modal-body {
      padding: 24px;
    }

    .page-footer {
      height: 24px;
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #A8ABB2;
      background: var(--page-bg);
      font-size: 12px;
      line-height: 20px;
      margin-top: 12px;
    }

    .column-setting-button {
      background: #FAFAFA !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .column-setting-button:hover,
    .column-setting-button:focus {
      background: #FAFAFA !important;
      border-color: transparent !important;
      color: var(--primary) !important;
    }

    .column-setting-panel {
      width: 176px;
      padding: 12px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
    }

    .column-setting-title {
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="root"><img class="logo" src="./assets/boss-ledger-logo.svg" alt="boss-ledger-logo" data-boss-logo-source="specs/boss logo.svg" style="display:none" /></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/dayjs-zh-cn.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/ant-design-icons.umd.js"></script>

  <script src="./preview-app.js"></script>
</body>
</html>
